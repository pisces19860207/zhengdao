[package]
name = "sha256poc"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
sha2 = "0.10"
hex = "0.4"

# JNI 薄层仅在 Android 目标编译（PC 上的 cargo test 只跑纯逻辑层）
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

[profile.release]
opt-level = 3
lto = true
