# workspace 级 cargo 配置（对 sha256poc / extract 两个成员同时生效）

# Android 交叉编译：NDK clang 包装器做 linker
# （NDK 27.2 最高带 API 35 包装器；产出 .so 在 Android 16/API 36 正常加载）
# 不依赖 cargo-ndk（其 host 侧 windows-sys 在 windows-gnu 工具链下 dlltool 有已知问题）
[target.aarch64-linux-android]
linker = "C:/Users/guoli/AppData/Local/Android/Sdk/ndk/27.2.12479018/toolchains/llvm/prebuilt/windows-x86_64/bin/aarch64-linux-android35-clang.cmd"

# host 目标（windows-gnu）：链接器用 rustup 自带的 mingw gcc（认得自身 libgcc/启动对象）；
# raw-dylib 的 dlltool 用 w64devkit（rustup 自带版缺 as.exe，CreateProcess 直接失败——
# 原 dlltool.exe 已改名 .broken 留证）
[target.x86_64-pc-windows-gnu]
linker = "C:/Users/guoli/.rustup/toolchains/stable-x86_64-pc-windows-gnu/lib/rustlib/x86_64-pc-windows-gnu/bin/self-contained/x86_64-w64-mingw32-gcc.exe"
rustflags = [
    "-C", "dlltool=C:/Users/guoli/w64devkit/w64devkit/bin/dlltool.exe",
]

# C 依赖（zstd-sys / sha2-asm）的 Android 交叉编译环境（cc crate 按此查工具）
[env]
CC_aarch64_linux_android = "C:/Users/guoli/AppData/Local/Android/Sdk/ndk/27.2.12479018/toolchains/llvm/prebuilt/windows-x86_64/bin/aarch64-linux-android35-clang.cmd"
AR_aarch64_linux_android = "C:/Users/guoli/AppData/Local/Android/Sdk/ndk/27.2.12479018/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe"
