# 证道（Zhengdao）质量验证流水线
# 独立开发声明：本文件为本项目原创，不含对第三方源码的拷贝。
#
# 与 build.yml 的分工：
#   - build.yml   = 产物流水线（APK + RootFS + Releases 发布，重；发布路径已压到约 3 分钟，
#                   RootFS 只在 rootfs/ 有改动时才重建 —— 见 ERRATA E-029/E-030）
#   - ci.yml      = 质量验证（编译 + 全量单测 + Rust 单测 + R8 冒烟 + lint 报告，轻；
#                   main 上约 3.5 分钟；R8 冒烟在 main 上交给 build.yml，只在 PR/手动时跑）
#                   ＋ supply-chain job（第四十三批：SBOM/OSV/许可报告，report-only 不拦 CI）
#
# 触发：推送到 main、PR 到 main、手动。
# 失败语义：单测失败 / 编译失败 / R8 构建失败 → job 红（这就是抓回归的价值）。
# 历史：packageScope 撞名导致的 release 启动崩溃（e1269f0 修复）若有此流水线，
#       R8 冒烟虽抓不到运行时错误，但「R8 产物存在性 + 体积突变」能提供线索。

name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# 2026-10-26：main 上**不再取消**，改成排队跑完。
# 实测最近 90 轮 ci：34 次 cancelled / 8 次 failure / 2 次 success —— 多会话同时往 main 推，
# 每推一次就把在跑的那轮掐掉，于是"永远是红叉/灰叉"，没人看得到真正的结论。
# PR 仍取消（同一个 PR 连推只留最后一轮，省 runner）。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # 607：趋势账要推到专用分支 ci/temp-trend（与 readings-emit 的 ci/readings 同款，main 不动）。
    # 只给 verify job —— supply-chain 仍是最小权限。
    permissions:
      contents: write
    # 2026-11-08：30 → 45。ci #1912（356aa427）在**冷缓存**那轮被 30 分钟上限掐死：
    # 编译 Debug APK 13.6 分 + 全量单测 10.4 分 + 其余静态门禁 ⇒ 到 lint 那步刚好到点，
    # GitHub 把超时作业记成 **cancelled**（不是 failure）；而取消的 run 不会存 cache ⇒ 下一轮又是冷缓存。
    # 暖缓存一轮约 13 分钟，45 分钟足够覆盖冷缓存，且不影响正常排队。
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          # fetch-depth: 0 —— 两条硬需求，缺一条就红：
          # ①「刷基线收窄门禁」（第㉗②-A 加分项）要能解析 HEAD~1；
          # ② 第三十三批「账本一致性门禁」的 D4（commit 短号可达）要在**本地对象库里**
          #    认得过台账/派工单引用到的每一个历史短号。
          # 2026-10-19 实测（E-162）：fetch-depth: 2 时 D4 把 1774 条历史短号全判成
          # `cat-file missing` —— 浅克隆里那些对象根本不存在，于是这道门禁量的是
          # 「CI 拉了多少历史」，不是「账对不对」。全历史 ≈ 67 MiB / 1990 提交，
          # 相对装 NDK + 跑 Gradle 是噪声；build.yml 一直用的就是 0。
          # 脚本侧另有硬守卫：浅克隆直接 exit 2 并指名原因，不再刷 1774 行假发现。
          fetch-depth: 0

      # ── 352（2026-11-01）：CI 双 JDK ─────────────────────────────────────────────
      # 仓库把 Gradle daemon 钉在 JDK 25（gradle/gradle-daemon-jvm.properties:
      # toolchainVersion=25，附各平台 foojay 下载 URL）。runner 预装只有 8/11/17/21
      # ⇒ 今天每次起 daemon 都匹配不上 criteria，走那条 URL "Downloading toolchain"。
      # 下面两步显式安装，**顺序刻意 21 → 25**（setup-java 每次都覆写 JAVA_HOME，
      # 后装者占 JAVA_HOME）：
      #
      # · JDK 21 —— detekt 子进程专用。detekt-cli 1.23.8 不认 JDK 25
      #   （JavaVersion.parse("25.0.3") 直接抛），而插件任务与 daemon 同 JVM 绕不开，
      #   所以 detekt 走 `JavaExec` + Java 21 toolchain 起子进程（见 app/build.gradle.kts
      #   detekt 段的 detektLauncher）。setup-java 会把这份 21 登记在 JAVA_HOME_21_X64，
      #   下面的 detekt 步骤用 `-Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64`
      #   显式指给它，并关掉 auto-download：缺了就地响亮地红，不静默下载。
      # · JDK 25.0.3（Temurin）—— Gradle daemon 用。钉 25.0.3 不钉 25.0.5：
      #   本机实测 Temurin 25.0.5+8 有 7 例 ledger 写盘假红（根因 357 在查），
      #   25.0.3 零假红，且与本机 Android Studio JBR 同版。criteria 只钉了 major 25
      #   （无 vendor 锁），Temurin 25.0.3 直接匹配 ⇒ gradle-daemon-jvm.properties 无需改动。
      - name: 安装 JDK 21（detekt 子进程专用）
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # GitHub CDN 偶发 504（2026-11-08 实测连红：setup-java 下载 Temurin 25.0.3 三次 504）。
      # 兜底三层：①缓存命中直接复用 ②setup-java 首试 ③失败则直连 Adoptium API 下载（自带 5 次退避）。
      - name: 缓存 JDK 25（Temurin 25.0.3）
        id: jdk25cache
        uses: actions/cache@v6
        with:
          path: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/25.0.3-9
          key: temurin25-25.0.3-9-linux-x64-v1

      - name: 缓存命中：直接用（免下载）
        if: steps.jdk25cache.outputs.cache-hit == 'true'
        run: |
          DEST=/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/25.0.3-9/x64
          test -x "$DEST/bin/java"
          echo "JAVA_HOME=$DEST" >> "$GITHUB_ENV"
          echo "$DEST/bin" >> "$GITHUB_PATH"

      - name: 安装 JDK 25（Temurin 25.0.3，Gradle daemon 用）
        id: jdk25
        if: steps.jdk25cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v6
        continue-on-error: true
        with:
          distribution: temurin
          java-version: '25.0.3'

      - name: 直连 Adoptium 兜底（setup-java 被 504 挡住时）
        if: steps.jdk25cache.outputs.cache-hit != 'true' && steps.jdk25.outcome == 'failure'
        run: |
          set -euo pipefail
          DEST=/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/25.0.3-9/x64
          mkdir -p "$DEST"
          URL="https://api.adoptium.net/v3/binary/version/jdk-25.0.3%2B9/linux/x64/jdk/hotspot/normal/eclipse"
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-delay 5 -o /tmp/jdk25.tgz "$URL"; then break; fi
            echo "Adoptium 下载失败（第 $i 次），退避 $((i*10))s"; sleep $((i*10))
          done
          test -s /tmp/jdk25.tgz
          tar -xzf /tmp/jdk25.tgz -C "$DEST" --strip-components=1
          "$DEST/bin/java" -version
          echo "JAVA_HOME=$DEST" >> "$GITHUB_ENV"
          echo "$DEST/bin" >> "$GITHUB_PATH"

      - name: 授权 gradlew（CI 上无 local.properties，SDK 走 runner 预装）
        run: chmod +x gradlew

      - name: 缓存 Gradle（依赖 + wrapper）
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-ci-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-ci-${{ runner.os }}-

      # 第二百五十批（终端收尾）：**删掉「读 NDK 版本 + 装 NDK」两步**。
      # 为什么可以删：主仓不再编任何 C/C++ —— 伪终端 JNI（libtermux.so）随终端搬去
      # zhengdao-term，proot 四件套也搬走了；:native-core 只用**人工构建入库**的
      # libzhengdao_core.so（不编，只打包）。NDK 留在 runner 上只是白等 3–5 分钟
      # （冷缓存）或几十秒（热缓存），且它自己还会偶发下载损坏。
      # 仍然保留的门禁（下面）：16KB 页对齐 + JNI 入口符号、.so 同源基线 —— 这两条
      # 与"编不编 C"无关，只与"入库的 .so 对不对"有关，必须留着。

      # E-048：入库的 libzhengdao_core.so 是**人工** cargo build + llvm-strip 后拷进来的，
      # 两条 workflow 都不构建它；而 16KB 对齐漏掉、JNI 入口被 strip 掉都不会编译失败，
      # 只会在真机上「loadLibrary 失败 → isRustAvailable()=false → 悄悄退回 Java」。
      # 所以在这里把「对齐 + 入口符号」做成门禁（期望符号现读 CoreNative.kt，自动跟新方法）。
      - name: 入库 .so 门禁（16KB 页对齐 + JNI 入口符号）
        run: python3 tools/check-native-so.py

      # E-128：上面的门禁查不出「.so 是不是这份源码编的」；这里比对
      # tools/so-provenance.json 里的 .so sha256 + 源码树指纹基线。
      - name: 入库 .so 同源门禁（so 与 rust/core/src 同源基线）
        run: python3 tools/check-so-provenance.py

      # 补一步（E-162）：把**已经推上 origin 的全部支线**拉进对象库。
      # 账本里大量短号指向「已合并/已删的施工支线」——其中有些在 origin 上还留着
      # 分支（`refs/heads/*`），但 checkout 只保证 main 的历史在本地，于是 D4 会把
      # 它们判成「公开仓库核验不到」。这一步只拉 commit 对象，几乎不花时间。
      - name: 拉全部远端分支（账本门禁 D4 要能看到已推支线的提交）
        run: git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'

      # 第三十三批（派工单 §1-B）：文档账本一致性门禁。账是文档账（FEATURE-LEDGER + ERRATA + 派工单），
      # 编号重复/缺号/引用查不到/commit 短号不可达全靠人肉对账，漂移已真实发生过两次。
      # 这一步把那五条机器能判的做成会红的门禁；默认只报告，--strict 有发现即红。
      # 已知存量（上游 commit、CI run 号、续记同号等）登记在 tools/doc-ledger-allowlist.txt，
      # 条目不再触发时会报「可删除」——烂账要能清掉。不许 continue-on-error：这批就是为了拦事。
      - name: 账本一致性门禁（第三十三批）
        run: python3 tools/check-doc-ledger.py --strict

      # 第㉗②-A 加分项：同源门禁是**基线驱动**的，所以「只改 tools/so-provenance.json
      # 把哈希刷成当前值」能让它变绿而产物根本没重编。这一步把这条捷径堵上：
      # 基线动了，就必须同时有 .so 或 rust/core/src/** 跟着动。
      - name: 刷基线收窄门禁（改基线必须连带改 .so 或 rust/core/src）
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="HEAD~1"; fi
          python3 tools/check-baseline-refresh.py --base "$BASE"

      # 第二十三批 B 段（派工单 §2.3）：进化门禁进 CI 的第二半——**跑测试之前**先确认
      # 评测集与基线水位没被顺手放松（用例不许删；passRate/avgSteps/cases/passing 不许松）。
      # 顺序写死：校验必须排在 testDebugUnitTest 之前，否则测试烧完分钟数才发现基线被改松。
      # BASE 与上面「刷基线收窄门禁」同一变量、同一写法（PR 取 base.sha，否则 HEAD~1；
      # checkout 的 fetch-depth: 0（全历史）保证这两个 rev 都在本地对象库里）。
      - name: 评测基线不许放松门禁（cases 不许删、baseline 不许松）
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="HEAD~1"; fi
          python3 tools/check-eval-baseline.py --base "$BASE"

      # 435（2026-11-04）：**显式拉起的 Activity 必须在清单注册**。第四刀（79c998c9）把
      # KeepaliveLogActivity / OpenSourceLicensesActivity 两条注册连注释一起删了，活代码仍在
      # startActivity ⇒ 两个设置入口点进去必 ActivityNotFoundException，而编译/单测/detekt/lint
      # 全绿。排在 assembleDebug 之前：静态扫描不依赖产物，红了就不用白烧一次构建。
      # --selftest 用合成数据自证「正例绿、删一条注册负例红」，防止门禁自己悄悄失效。
      - name: Activity 注册防回归门禁（435 · 显式启动目标必须在 manifest）
        run: |
          python3 tools/check-activity-registration.py --selftest
          python3 tools/check-activity-registration.py

      # ── 600（2026-11-11）：接线闸两道一起接 ──────────────────────────────────
      # 为什么两道一起接：591 的「样本锚与接线登记闸」此前**从未进 CI**（`git log -S
      # check-evo-anchor-wiring -- ci.yml` 为 0 次：白名单写了，但没人按着 ⇒ 成了纸）。
      # 两道闸各管一件事，缺一道就有缝：
      #   · 591 闸：**锚与登记**——某域声明了锚、却没接进生产，白名单只减不增；
      #   · 600 闸：**装配类有没有生产调用点**——按 baseline 判名册漂移（四条红标准）。
      # 都先跑 --selftest：两个脚本各自的负例必须真红，否则「本机绿、CI 也绿」不成立。
      # 600 闸的四条红（实测各造一次都对得上）：
      #   R1 新增待判（新写了 wiring 没人调）／R2 翻成待判（接上的线断了）
      #   R3 名册消失（删/改名没对账）／R4 裁定过期（RULINGS 与事实不符）
      # **不红**：新增纯常量/纯 DTO/端口接口，以及「待判 → 有调用点」（接上了是好事）。
      # 600 闸只读：`--check` 不写任何文件（ci.yml 里不跑 `--generate`，基线只能人写；
      # `--allow-add` 也只许本地交互，CI 里传了会退 2）。
      # 断言套件是独立文件 `tools/wiring_report_test.py`（测试搬进工具房，改断言要过 review）。
      # R5（防洗）要 `git diff <base>` 取「本次改了哪些生产文件」——PR 检出默认不带
      # origin/main 这个 remote-tracking ref，所以先补一刀；fetch 失败不许当绿，
      # `--check` 自己会因「判不了 R5」退 2。
      # 排在这里（assembleDebug 之前）与 435 同一条理由：两道闸都不依赖构建产物，
      # 秒级跑完；接线欠账该在**烧掉一轮 13 分钟构建之前**就报出来。
      - name: 接线闸（591 样本锚登记 · 白名单只减不增）
        run: |
          python3 tools/check-evo-anchor-wiring.py --selftest
          python3 tools/check-evo-anchor-wiring.py

      - name: 接线闸（600 接线清单 · 六条红标准：R1–R4 名册 + R5 防洗 + R6 收据）
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main || true
          python3 tools/wiring_report_test.py
          python3 tools/wiring-report.py --check

      - name: 编译 Debug APK（含 .so 打包验证）
        run: ./gradlew :app:assembleDebug --console=plain

      # ── 611（2026-11-12）：**打包产物**里的 .so 也要过 16KB 判据 ────────────────
      # 为什么补在 assembleDebug 之后：上面那道「入库 .so 门禁」只扫 jniLibs 源码目录，而
      # **依赖自带的 .so**（androidx.graphics:graphics-path）与 merge/strip 之后那份只在
      # build/ 里出现 —— 源码树里根本没有它们，它们照样进 APK、照样在 16KB 页设备上
      # loadLibrary 失败并静默退回 Java。611 段A 先另写过一份独立脚本，实测它唯一多出的
      # 就是这一面（理由与取舍写在 tools/check-native-so.py 顶部）；同一判据挂两处迟早只修
      # 一处，故并进本脚本（--artifact），只留一份 ELF 解析，那份独立脚本已删。
      # 先跑 --selftest：合成 APK 里塞 4KB ⇒ 必须红并点名包内路径、16KB ⇒ 必须绿、
      # 非 zip ⇒ 必须报「读不出」（不许静默跳过）。红时点名「包内路径 ← 来源依赖/模块」，
      # 来源取 AGP 的 native-libs-blame 报告。
      - name: 打包产物 .so 门禁（APK 内 lib/<abi>/*.so 的 16KB 对齐 · 611）
        run: |
          python3 tools/check-native-so.py --selftest
          python3 tools/check-native-so.py --artifact 'app/build/outputs/apk/debug/*.apk'

      # E-105 的门禁：那次实测发现 AGP 打包**会剥掉构件顶层的 META-INF/LICENSE* / NOTICE***
      #   （commons-compress 有 LICENSE.txt/NOTICE.txt 却一个都没进 APK，zstd-jni 的 .so 进了
      #   包而它的 BSD-2 正文没进），所以「随构件分发」不能当承诺 —— 义务只能由我们自己随包
      #   放进 assets/licenses/。这一步把它变成会红的断言：仓库 licenses/ 里的每份正文都要在
      #   APK 里逐字节存在，并对 zstd 原生产物、okhttp 的 publicsuffixes.gz 这两处单独核。
      - name: 许可证正文门禁（APK assets/licenses/ 与仓库逐字节一致）
        run: python3 tools/check-licenses.py

      - name: 全量单元测试（失败即红）
        run: ./gradlew :app:testDebugUnitTest --console=plain

      # ── 612（2026-11-12）：L3 红线底账聚合 ─────────────────────────────────────
      # docs/L3-红线底账.md = 红线（人话）↔ 实现落点 ↔ 既有负例 的对账表（31 条，六组：
      # 不可逆未确认/越权外发/停机后仍执行/回滚失败静默/账本被直改/假动作）。
      # 本步**只按名字筛既有用例**重跑（tools/run-redline-tests.py，gradle --tests，
      # 不复制判定逻辑）；排在全量单元测试之后：单测先兜底，这里只可能红在「红线负例本身」。
      # 先 --selftest 自证解析器红路（字段空／编号重复／状态越界／模块认不出／表格混入陌生行），
      # 再真跑：底账逐条过；某条真没负例的行如实列「缺负例」列进交付报告，不许补写冒充有。
      # 底账里用例改名/被删 ⇒ --tests 筛不到当场红（底账不许指向不存在的用例）；
      # 红时 ::error 点名「哪条红线、哪个用例」，匿名可读。
      - name: L3 红线负例聚合（612 · 底账逐条点名）
        run: |
          python3 tools/run-redline-tests.py --selftest
          python3 tools/run-redline-tests.py

      # ── 607（2026-11-12）：口径改为「只数测试自建的」，并把每轮读数记进趋势账 ──────
      # 旧口径（564）数的是 `app/build/**/tmp*` 里的目录总数，把构建系统自己的 tmp
      # （`.cache`、`compileDebugJavaWithJavac/compileTransaction`、`kapt…`、JDK 的
      # `jar_extract_*`）一起算进了水位 ⇒ 读数跟着「这轮跑没跑 detekt / 中间产物清没清」上下跳，
      # 那不是测试泄漏，是别人的噪声。
      # 新口径（脚本头有判决表）：**只数测试建的沙盒根**，构建系统 tmp 一个都不数；
      # 判定用「名字（Gradle 任务名形态）+ 产生者（只在 build/tmp 这一层建）」两条一起看，
      # `testDebugUnitTest` 之下不判名字（测试根里叫 `compileDebug…` 的目录照样计数）。
      # 判红：**CI 超预算红；本地只提示**（607 ②：本地环境差异不作判据）。
      # 预算 = tools/test-temp-budget.json 的 measured（干净单轮实测）+ 固定余量 20，脚本自算。
      # --record 追加一行 {date, measured, budget, commit} 到 tools/test-temp-trend.jsonl。
      # --selftest 用合成树自证四条：Gradle 式 tmp 不计数、测试 tmp 计 +1、
      # 伪装/同层/长数字三种反例照样计数、超一条时 CI 红而本地 WARN。
      - name: 测试临时目录闸（607 · 只数测试自建｜预算 = 实测 + 20）
        if: always()
        run: |
          python3 tools/check-test-temp.py --selftest
          python3 tools/check-test-temp.py --record
          echo "---- 趋势末两行 ----"
          tail -2 tools/test-temp-trend.jsonl || true

      # 趋势账要跨轮累积 ⇒ 推到专用分支 `ci/temp-trend`（与 readings-emit 的 `ci/readings`
      # 同款：main 一字不动）。PR 上不推（fork 无写权限，也会把 PR 读数混进主线账）。
      # continue-on-error：趋势是账、不是判据 —— 推失败不该把一轮验证判成红（那是假红）。
      - name: 归档趋势账（ci/temp-trend）
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          set -euo pipefail
          NEW="$(tail -1 tools/test-temp-trend.jsonl)"
          RUN_ID="${{ github.run_id }}"
          git config user.name "temp-trend"
          git config user.email "actions@users.noreply.github.com"

          # 607 修订（2026-11-13，ci #1974 真因）：**全程不碰工作树**。
          # 旧实现走 `git checkout --orphan` + `git rm -rf --cached .` + `git clean -fdx`；
          # 在 `ci/temp-trend` 还不存在的那一轮（#1974 恰好是第一次）`--cached` 之后
          # 所有文件都成了未跟踪，`git clean -fdx` 把整个检出目录清空 ⇒ 后面三步
          # （单测失败清单／入口覆盖清点／Android Lint）找不到脚本与报告，全部 exit 2 报红，
          # 而那轮 10563 例单测其实是过的 —— 是这一步把树删了，不是代码坏了。
          # 现在改用 plumbing + 独立 index：读旧账 → 追加 → 写 blob/tree/commit → push，
          # 只在 $tmp 里操作；分支首次不存在也能建。
          tmp="$(mktemp -d)"
          git fetch --no-tags origin ci/temp-trend >/dev/null 2>&1 || true
          if git rev-parse --verify --quiet origin/ci/temp-trend >/dev/null; then
            base="$(git rev-parse origin/ci/temp-trend)"
            git show "$base:tools/test-temp-trend.jsonl" > "$tmp/trend.jsonl" 2>/dev/null || : > "$tmp/trend.jsonl"
          else
            base=""
            : > "$tmp/trend.jsonl"
          fi
          if grep -q "\"run\": \"$RUN_ID\"" "$tmp/trend.jsonl"; then
            echo "run $RUN_ID 已在账上（重跑），不重复落行"
            exit 0
          fi
          printf '%s\n' "$NEW" >> "$tmp/trend.jsonl"
          export GIT_INDEX_FILE="$tmp/index"
          if [ -n "$base" ]; then git read-tree "$base"; else git read-tree --empty; fi
          blob="$(git hash-object -w "$tmp/trend.jsonl")"
          git update-index --add --cacheinfo 100644,"$blob","tools/test-temp-trend.jsonl"
          tree="$(git write-tree)"
          if [ -n "$base" ]; then
            commit="$(git commit-tree "$tree" -p "$base" -m "trend: run $RUN_ID")"
          else
            commit="$(git commit-tree "$tree" -m "trend: run $RUN_ID")"
          fi
          git push origin "$commit:refs/heads/ci/temp-trend"

      # 2026-10-30：这一步不判成败，只**把失败的用例变成注解**。
      # 起因：CI 红在测试步时，注解里只有一句 `Process completed with exit code 1.`，
      # 日志要登录才看得到 ⇒「红了但查不动」。现在匿名打开 Actions 页就能看到 类名#用例名 + 首行消息。
      - name: 单测失败清单（注解：类名#用例名 + 首行消息）
        if: always()
        run: python3 tools/ci-test-annotations.py

      # #1（2026-10-09）：仪器测试（androidTest）在本仓库**进不了 CI 的模拟器**——
      # 本包只打 arm64-v8a（app/build.gradle.kts:103-110，用户 2026-10-06 定案「不做
      # x86_64 模拟器支持」），GitHub runner 上的 x86_64 模拟器装不上这个包。
      # 但 androidTest 源码长期「没人编译」的风险是真的：重构一下就会悄悄坏掉，
      # 等真机上跑才发现。所以这里只保证它**能编译**；存储读写那条真机冒烟用例在
      # app/src/androidTest/java/com/example/zhengdao/storage/StorageReadWriteSmokeTest.kt，
      # 跑法写在它的类注释里。
      - name: 编译仪器测试 APK（androidTest 至少必须能编译）
        run: ./gradlew :app:assembleDebugAndroidTest --console=plain

      - name: 缓存 cargo（Rust 逻辑层单测用；key 走已入库的 rust/Cargo.lock）
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # 第㊶刀（2026-10-15；㉗② 方案 A′ → **B3+ 按主机基线**）：从当前源码**重新编一遍** .so，与
      #   本主机那份归一化基线逐字节比对（ubuntu ⇒ tools/so-repro-baseline-ci.json）
      #   —— 补上「基线可自刷」之外最后一环：产物必须真能从这份源码编出来（既有三道门禁都只验
      #   「库里的东西对不对」，没有一道验「这份源码能不能编出这个库」）。
      #   ⚠️ 实测**跨主机不可逐字节复现**（Windows 与 ubuntu 差 160 B：.text/.rodata/.rela.dyn/
      #   .eh_frame*/.dynsym 内容不同，补全 sysroot/rustup/临时 target 的 remap 也不变）
      #   ⇒ 门禁按主机各自钉基线；用户 2026-10-15 拍板 B3+（证据：证道设计报告/证道-第41刀…md）。
      #   本主机第一次跑（还没有它那份基线）**不判红**：脚本把整份基线以 base64 打进 ::notice 再退出 2。
      #   ✅ **硬门禁**（2026-10-15 深夜转正）：`e2d1313` 那次 run 已打出「与 tools/so-repro-baseline-ci.json
      #   逐字节一致 ✔」（verify success），观察期结束 ⇒ 摘掉 continue-on-error。本步从此判红即 CI 判红。
      #   读数走 ::notice / ::warning annotation：本仓库 Actions 日志未登录读不到，而
      #   check-runs annotations 接口**匿名可读**（同 Rust 单测段的处置，见 ERRATA E-028）。
      #   本机（Windows）与 CI（ubuntu）的差异由脚本自己注入：NDK 的 linker / CC / AR 路径
      #   按本机 SDK 现拼（rust/.cargo/config.toml 里那些是 Windows 绝对路径），
      #   归一化前缀＝sysroot / rustup home / cargo home / 仓库根 / 临时 target 目录。
      # 2026-10-28 补：重编比对 lane 需要 NDK（cargo 交叉编译用 linker/CC/AR）。
      # 250 曾把「装 NDK」整步删掉（主仓不再编 C/C++ 是对的），但这条 lane 仍要它 ⇒ 只在这一步前装，
      # 装不上就明确红在半路（不许跳过），失败重试 3 次（NDK 下载偶发损坏，见 ERRATA）。
      - name: 装 NDK（仅重编比对 lane 需要）
        run: |
          NDK_VER="27.2.12479018"
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -d "$SDK/ndk/$NDK_VER" ]; then echo "NDK $NDK_VER 已在：$SDK/ndk/$NDK_VER"; exit 0; fi
          for i in 1 2 3; do
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VER" >/dev/null 2>&1 && break
            echo "第 $i 次装 NDK 失败，重试…"; sleep 5
          done
          test -d "$SDK/ndk/$NDK_VER" || { echo "::error::NDK $NDK_VER 装不上（重编比对 lane 需要它）"; exit 1; }

      # ── 2026-10-29：把四个"只写在纸上的门禁"接进 CI（此前从未在 ci.yml 出现过）──
      #   为什么现在接：`git log -S <脚本名> -- ci.yml` 全部 0 次 ⇒ 它们写了但从没跑过；
      #   法典门禁（271）尤其严重：删改法典条文不会红，等于没有门。
      - name: 法典门禁自查（271 批：门禁 15／规范 7，含"门禁必须碰生产"机检）
        run: python3 tools/check-law-gates.py

      - name: 判据进化门禁（310 批：不可进化清单／锚定只增／纪元账三态／禁标量分）
        run: python3 tools/check-criteria-gates.py

      - name: 账本重复检查（同段重复行、重复章节）
        run: python3 tools/check-ledger-dupe.py

      # 535 B 段：裸计数标签（把闸下限/请求上限写成 n= / count=）
      - name: 读数标签
        run: python3 tools/check-metric-labels.py --selftest
      - name: 读数标签（全仓）
        run: python3 tools/check-metric-labels.py

      # 451（2026-11-05）：memory.as_of 旧库升级的**真跑**自检——本仓无 Robolectric，
      # JVM 单测只能钉语句层；这里用 sqlite3 真建 v20 老库、真跑迁移、真查待复核。
      - name: 记忆 as_of 迁移真跑（451 批：旧库 NULL 可读／复核边界／变异负例）
        run: python3 tools/check-memory-asof-migration.py --selftest

      - name: 圆角令牌门禁自测（第七十批：钉住"门禁自己会不会误杀/放水"）
        run: python3 tools/check-radius-tokens-selftest.py

      - name: LocalContext 取资源门禁（第 133 批；2026-10-29 起跳过注释行）
        run: python3 tools/check-localcontext-res.py

      # 352③（2026-11-01）：public 面清单闸。:policy/:core 的**顶层声明**必须登记在
      # tools/public-surface.json（Kotlin 默认 public ⇒ 293 抽 :policy / 240 抽 :core 时
      # 顶层整批放宽；谁放宽、为什么、能不能收紧见注册表 origin/verdict 字段）。
      # 未登记的顶层 public 面 ⇒ 红——防模块面悄悄变成对外 API（342 交付注记：
      # ":core 的保护不靠租约，改由本闸承担"）。成员级不在本闸，走 code review。
      - name: public 面清单闸（:policy/:core 顶层声明，未登记即红）
        run: python3 tools/check-public-surface.py
      # 362（2026-11-02）：测试平台无关闸。CI 跑 Linux、本机是 Windows，测试里用反斜杠／盘符／
      #   os.name 分支／写死 /tmp 拼路径 ⇒「本机绿、CI 红」——今天 ci #1747 就是这么红的（修于 b2ffe874）。
      #   只扫各模块名含 test 的 sourceSet；四种形状命中即红；确实要留平台形状的写
      #   `// platform-gate: allow 理由：……`（同行或紧邻上一行）。口径与已知放过见脚本头注释。
      #   这一步先跑 --selftest：四条负例各命中一次，证明这扇门在 Linux 上也不是恒绿。
      - name: 测试平台无关闸（T1 反斜杠／T2 盘符／T3 os.name／T4 写死路径，只扫测试源）
        run: |
          python3 tools/check-test-platform-gate.py --selftest
          python3 tools/check-test-platform-gate.py

      # 373（2026-11-02）：入口覆盖清点——「有功能没入口」从人肉发现变成可重复清单
      # （A 有定义无调用／B 只有测试在调／C 默认关无开启路径）。**只报不拦**：脚本默认
      # 模式永远退出 0（--strict 才会因缺结论/陈旧注册红，交付前人工跑），先观察一版。
      # 结论登记在 tools/entry-coverage-conclusions.json，报告进 docs/entry-coverage.*，
      # NOT_WIRED（结论=接线）计数是接线欠账表，拿它排后续。产物上传 14 天供翻看。
      - name: 入口覆盖清点（373 · 只报不拦）
        if: always()
        run: |
          python3 tools/check-entry-coverage.py
          python3 tools/check-entry-coverage.py --selftest
          echo "NOT_WIRED（结论=接线）计数见上；详见 docs/entry-coverage.md"
      - name: 上传入口覆盖报告（artifact · 14 天）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entry-coverage
          path: |
            docs/entry-coverage.md
            docs/entry-coverage.json
          retention-days: 14
          if-no-files-found: warn

      - name: 重编比对 lane（第㊶刀 · B3+ 按主机基线：硬门禁）
        run: |
          python3 tools/rebuild-and-compare.py

      # 这 8 例（sha256 4 + extract 4）是解压主路径的安全网，此前只在人手动跑过：
      # 本机 cargo test 需要 host C 编译器（Windows 上还得 w64devkit 在 PATH，见 ERRATA E-027），
      # 而 ci/build 两条流水线里从来没有 cargo 步骤 —— 放到 ubuntu runner（自带 gcc）最省事。
      #
      # 失败时把要点抛成 annotation：本仓库的 Actions 日志未登录读不到，
      # 而 `GET /repos/{owner}/{repo}/check-runs/{id}/annotations` 是匿名可读的
      # （首次把这一步接进 CI 就是靠它才看到平台差异的原文，见 ERRATA E-028）。
      - name: Rust 逻辑层单测（PC 层纯逻辑，失败即红）
        run: |
          cd rust
          set +e
          cargo test -p zhengdao_core --release 2>&1 | tee /tmp/cargo-test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -E '(^error|^warning: unused|FAILED|panicked|assertion|^ *-->|left:|right:)' /tmp/cargo-test.log \
              | tail -n 8 | while IFS= read -r line; do
                  echo "::error title=cargo test 失败::${line}"
                done
            echo "::error title=cargo test::退出码 ${code}（完整输出见本步骤日志）"
          fi
          exit "$code"

      - name: 归档单测报告（无论成败都上传）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
          if-no-files-found: warn

      # ⚠️ ERRATA E-030：main 分支上这一步与 build.yml 的「编译 Release APK」完全重复
      #    （那边还多一道"对着产物验签名"的硬关卡），而 build.yml 每次推 main 都会跑
      #    ⇒ 这里只在 PR 与手动触发时跑，省下 2 分钟；PR 上仍保留"R8 能不能编"的快反馈。
      - name: R8 冒烟（release 可构建——验证混淆/资源收缩不炸）
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        # 只验「混淆 + 资源收缩会不会炸」，产物**不发布**，所以放行 build.gradle.kts 里那道
        # 「没有发版钥匙就不许打 release 包」的断言（CI 的发布路径由 build.yml 把关：还原正式
        # 钥匙时对指纹 + assembleRelease 之后 apksigner 验产物）。
        run: ./gradlew :app:assembleRelease --console=plain -PallowDebugSignedRelease

      # E-072：R8 究竟把哪个类/方法改了名，唯一的地面真值是构建产物 mapping.txt —— 单测和
      #   .so 门禁都够不到它。这一步把"关键类未被改名 + onProgress 保住"变成会红的断言
      #   （E-022 就是 onProgress 被改名导致 release 一装环境就 SIGABRT）。
      # ⚠️ 必须紧跟 assembleRelease（上面那步），不能挂到只跑单测的 job 上——否则找不到产物。
      - name: R8 产物断言（关键类未被改名 + onProgress 保住）
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: python3 tools/check-r8-mapping.py

      # ── 第二百六十六批（2026-10-28）：死代码清单 ＋ 依赖体检成品 ────────────────────
      # R8 的 `-printusage`（见 app/proguard-rules.pro）把「发布包实际被裁掉的类/成员」逐条写出来 ——
      #   这是编译器替我们做的可达性分析，比 detekt / grep 准。资源侧由 AGP 自己写
      #   resources.txt（⚠️ R8 **不认** ProGuard 的 `-printresources`，实测整包构建直接失败）。
      #   本机拿不到（release 签名规矩），所以清单在 CI 出、从 artifact 下载。
      - name: 上传 R8 死代码清单（usage / resources / mapping）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r8-deadcode-lists
          path: |
            app/build/outputs/mapping/release/usage.txt
            app/build/outputs/mapping/release/resources.txt
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 30
          if-no-files-found: warn

      # detekt 从「只出报告」转为**上闸**（266 批，2026-10-28）。
      #   324（2026-10-31）**口径修正**：10-19 的旧 baseline 实际还压着 101 条真读数
      #   （双跑对照 334→435），baseline 文件与指到它的参数已整条删除、预算用真读数重记
      #  （raised_reason 写明「口径修正，非放宽」）。防回归门禁见下一步。
      # 276a D1（2026-10-29）：**硬墙**先跑——上限取自 config/detekt/detekt-wall.yml 的 `maxIssues`
      #   （557 起从 detekt.yml 移驾；墙只开 CyclomaticComplexMethod，LongMethod 降为提示），
      #   交给 detekt 自己的 `--max-issues`；超一条就非 0（不经过下面的 python 脚本）。
      #   这道闸的意义：就算有人把预算脚本从流水线里删掉，上限还在 detekt 这边。
      # 352：detekt 子进程用 JDK 21（见顶部「CI 双 JDK」注释）。
      # fromEnv=JAVA_HOME_21_X64 把 setup-java 装的 21 指给 toolchain；
      # auto-download=false ⇒ 万一指不上就地红，绝不静默下载（352 判据②）。
      # 日志 tee 到 /tmp 供下面的「toolchain 零下载断言」扫描。
      - name: detekt 硬墙（发现条数 > maxIssues 即失败，不经脚本）
        run: |
          set -o pipefail
          ./gradlew :app:detektWall --console=plain \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64 \
            -Dorg.gradle.java.installations.auto-download=false \
            2>&1 | tee /tmp/detekt-wall.log

      - name: detekt 预算闸（与硬墙互锁：两处必须相等；存量不动，新增即红）
        run: |
          set -o pipefail
          ./gradlew :app:detektReport --console=plain \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64 \
            -Dorg.gradle.java.installations.auto-download=false \
            2>&1 | tee /tmp/detekt-report.log
          python3 tools/check-detekt-budget.py

      # ── 352（2026-11-01）：观察档——detekt 视野扩到 :policy/:core ──────────────────
      # 主 lane（上面硬墙/预算闸）仍只扫 app、预算 402 一个字不动（354/359 的账）；
      # 这条 lane 只把 :policy/:core 的读数**亮出来**：8 条存量列成注解（匿名可读），
      # 存量不拦闸；但**只增即红**（上限=当前读数，tools/check-detekt-modules-observe.py）。
      # 359 清完这 8 条（policy 5 ＋ core 3）复跑归 0 后，把 app/build.gradle.kts 的
      # detektCommonArgs --input 切到全模块（strict，一开关）并退役本步。
      - name: detekt 观察档（:policy/:core，report-only ＋ 只增即红）
        run: |
          set -o pipefail
          ./gradlew :app:detektModulesReport --console=plain \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64 \
            -Dorg.gradle.java.installations.auto-download=false \
            2>&1 | tee /tmp/detekt-modules.log
          python3 tools/check-detekt-modules-observe.py

      - name: detekt 门禁：build 脚本与 config 不许再现 baseline 参数（324）
        run: python3 tools/check-detekt-no-baseline.py

      # 352 判据②：CI 日志里不许再出现 toolchain 下载。daemon（25.0.3）由 setup-java
      # 显式安装、criteria 由本机安装满足；detekt 子进程（21）由 JAVA_HOME_21_X64 提供。
      # 谁还在下载就红在这里——不用人肉翻日志。
      - name: toolchain 零下载断言（352 判据②）＋ daemon JVM 读数
        run: |
          ./gradlew -q --version 2>&1 | tee /tmp/gradle-version.log
          echo "---- Launcher JVM 读数（应为 25.0.3）----"
          grep -iE "launcher jvm|jvm:" /tmp/gradle-version.log || true
          echo "---- toolchain 下载痕迹扫描 ----"
          if grep -inE "foojay|provision|downloading[^\n]*(toolchain|jdk)|toolchain[^\n]*(download|provision)" \
              /tmp/detekt-wall.log /tmp/detekt-report.log /tmp/detekt-modules.log; then
            echo "::error title=toolchain 零下载断言::Gradle 日志出现 toolchain 下载/供应痕迹（352 判据②）"
            exit 1
          fi
          echo "未发现 toolchain 下载痕迹 ✔"

      - name: 归档 detekt 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: detekt-report
          path: |
            app/build/reports/detekt/detekt.html
            app/build/reports/detekt/detekt.xml
            app/build/reports/detekt/detekt-modules.html
            app/build/reports/detekt/detekt-modules.xml
          retention-days: 14
          if-no-files-found: warn

      # 依赖体检：把 gradle 的依赖树整理成「零引用候选 / 重复版本 / 体积风险」三档。
      #   本批用它找出了 commons-compress / commons-lang3 / tukaani:xz 三个无主依赖（已删）。
      #   ⚠️ 零引用候选只是**候选**：能删的判据是「删完 assembleDebug ＋ 全量单测仍绿」。
      - name: 依赖体检（三档清单 → dep-report artifact）
        run: |
          mkdir -p build/deps
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --console=plain > build/deps/deps.txt
          python3 tools/dependency-report.py --deps build/deps/deps.txt

      - name: 归档依赖体检表
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dep-report
          path: |
            build/deps/deps.txt
            build/deps/deps-summary.md
          retention-days: 14
          if-no-files-found: warn

      - name: 上传 release APK（冒烟产物，保留 7 天）
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: zhengdao-release-smoke
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: warn

      - name: Android Lint（预算闸：不许新增告警；报告入 artifact）
        if: always()
        # P0-2（2026-10-19）：原来这里 `|| echo` 把失败吞掉，告警数永远不可见。
        # 现在分两步：先跑 lint（允许它失败，报告仍要出），再用 tools/check-lint-budget.py
        # 对比 tools/lint-baseline.json —— 超过基线就红。Error 级告警始终判红。
        run: |
          ./gradlew :app:lintDebug --console=plain || echo "lint 自身返回非零（仍有严重问题），报告见 artifact"
          python3 tools/check-lint-budget.py

      - name: 归档 lint 报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14
          if-no-files-found: ignore

  # 第四十三批（供应链可见）：SBOM ＋ 离线 OSV 漏洞扫描 ＋ 许可/版本报告。
  # 三条纪律（派工单红线）：
  #   ① 全部 report-only —— 本 job 每一步都 continue-on-error，**永远不拦 CI**；
  #   ② 不动业务代码/构建脚本/AGP/Kotlin —— SBOM 闭包由 tools/sbom-init.gradle.kts
  #      （-I 注入的 init script）解析，Gradle 侧零改动；
  #   ③ 离线优先 —— 漏洞库是入库快照 tools/osv/osv-scanner/Maven/all.zip
  #      （数据截止日见报告首行），scanner 二进制固定版本＋sha256 校验。
  # 独立 job：verify 红/绿都不影响本 job 跑，产物永远归档。
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # 352：daemon 统一 JDK 25.0.3（gradle/gradle-daemon-jvm.properties 钉 major 25，
      # runner 预装没有 25，不显式装就走 foojay "Downloading toolchain"——352 判据②
      # 要求任何 job 都不再出现）。本 job 不跑 detekt，无需 JDK 21。
      # GitHub CDN 偶发 504（2026-11-08 实测连红：setup-java 下载 Temurin 25.0.3 三次 504）。
      # 兜底三层：①缓存命中直接复用 ②setup-java 首试 ③失败则直连 Adoptium API 下载（自带 5 次退避）。
      - name: 缓存 JDK 25（Temurin 25.0.3）
        id: jdk25cache
        uses: actions/cache@v6
        with:
          path: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/25.0.3-9
          key: temurin25-25.0.3-9-linux-x64-v1

      - name: 缓存命中：直接用（免下载）
        if: steps.jdk25cache.outputs.cache-hit == 'true'
        run: |
          DEST=/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/25.0.3-9/x64
          test -x "$DEST/bin/java"
          echo "JAVA_HOME=$DEST" >> "$GITHUB_ENV"
          echo "$DEST/bin" >> "$GITHUB_PATH"

      - name: 安装 JDK 25（Temurin 25.0.3，Gradle daemon 用）
        id: jdk25
        if: steps.jdk25cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v6
        continue-on-error: true
        with:
          distribution: temurin
          java-version: '25.0.3'

      - name: 直连 Adoptium 兜底（setup-java 被 504 挡住时）
        if: steps.jdk25cache.outputs.cache-hit != 'true' && steps.jdk25.outcome == 'failure'
        run: |
          set -euo pipefail
          DEST=/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/25.0.3-9/x64
          mkdir -p "$DEST"
          URL="https://api.adoptium.net/v3/binary/version/jdk-25.0.3%2B9/linux/x64/jdk/hotspot/normal/eclipse"
          for i in 1 2 3 4 5; do
            if curl -fsSL --retry 3 --retry-delay 5 -o /tmp/jdk25.tgz "$URL"; then break; fi
            echo "Adoptium 下载失败（第 $i 次），退避 $((i*10))s"; sleep $((i*10))
          done
          test -s /tmp/jdk25.tgz
          tar -xzf /tmp/jdk25.tgz -C "$DEST" --strip-components=1
          "$DEST/bin/java" -version
          echo "JAVA_HOME=$DEST" >> "$GITHUB_ENV"
          echo "$DEST/bin" >> "$GITHUB_PATH"

      - name: 授权 gradlew（CI 上无 local.properties，SDK 走 runner 预装）
        run: chmod +x gradlew

      - name: 缓存 Gradle（SBOM 的 release 闭包解析用；key 与 verify 一致）
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-ci-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-ci-${{ runner.os }}-

      - name: 缓存 osv-scanner 二进制（固定版本，manifest 哈希做 key）
        uses: actions/cache@v6
        with:
          path: ~/.cache/zhengdao-tools
          key: osv-scanner-${{ runner.os }}-${{ hashFiles('tools/osv-scanner.json') }}

      # 任务 A：CycloneDX 1.5 SBOM。主清单 = :app releaseRuntimeClasspath 全量闭包
      # （含传递依赖）；debug/test/androidTest/benchmark/macrobenchmark 分区单列。
      # 文件名带 commit 短号与日期（派工单 §1 要求）。
      - name: 生成 SBOM（report-only）
        continue-on-error: true
        run: python3 tools/sbom.py --commit "${GITHUB_SHA::7}"

      # 任务 A 验收件：构建文件声明的直接依赖必须全部在 SBOM 对应分节里
      # （catalog 访问器/字面坐标/BOM 托管版本都解析）。
      - name: 直连依赖断言（验收下限）
        continue-on-error: true
        run: python3 tools/check-sbom-direct-deps.py

      # 任务 B：离线 OSV 扫描（入库快照；报告首行数据截止日）。
      - name: 离线 OSV 漏洞扫描（report-only）
        continue-on-error: true
        run: python3 tools/osv-scan.py

      # 任务 B 验收件：合成夹具（log4j-core:2.14.1 高危 / commons-compress:1.25.0
      # 中危 / xz:1.9 干净）必被扫出；同一输入连跑两次 diff 为空。
      - name: OSV 夹具自检
        continue-on-error: true
        run: python3 tools/osv-scan.py --selftest

      # 任务 C：许可证分布（SPDX，对齐 licenses/ 口径）＋ 未知/冲突清单 ＋
      # 落后主版本 ≥1 的新鲜度（只报告不升级）。
      - name: 许可与版本新鲜度报告（report-only）
        continue-on-error: true
        run: python3 tools/license-report.py

      # ── 任务 D（423）：许可政策门禁 —— 本 job 里唯一**会红**的一步 ────────────────
      # 上面四步都是 report-only（看得见、不拦人）。这一步不同：许可政策是准入门槛，
      # 红了就该合不进去，否则等于又写了一张纸。
      #
      # 政策（真源在脚本常量里）：Apache-2.0/MIT/BSD-2/3/ISC/Zlib/0BSD/Unlicense/MPL-2.0
      # 允许；GPL/AGPL/LGPL/SSPL 按家族禁止；其余（EPL/CDDL/PublicDomain 这类）、POM 无声明、
      # 本地缓存缺 POM —— 都要在 licenses/EXCEPTIONS.md 逐条登记才算过（坐标/许可/谁批/
      # 为什么/复查时间，缺一格不算登记，过期即失效）。
      #
      # 为什么排在 SBOM 之后：脚本**不联网**，许可只从本地 Gradle 缓存的 POM 取；sbom.py
      # 会跑 gradlew 解析依赖，等于顺带把 POM 落进 ~/.gradle/caches（上面 restore 的那份）。
      # 排前面的话首次冷缓存会把所有条目判成「未取证」。
      #
      # 已知现状（2026-11-04）：main 上 jxl（LGPL-2.1）还在 ⇒ 这一步**会红**，这是正确行为
      # ——门禁第一次跑就抓到了唯一一个真正的许可问题。422（jxl → Apache-2.0 的 POI）合入后
      # 自然转绿，不需要在 EXCEPTIONS.md 里给 jxl 开后门。
      - name: 许可政策门禁（423：禁止/未登记/未取证 ⇒ 红）
        run: |
          python3 tools/check-license-policy.py --selftest
          python3 tools/check-license-policy.py

      # ── 任务 E（424）：第三方声明自动生成门禁 ──────────────────────────────
      # THIRD-PARTY-LICENSES.md 的「依赖各节」由 tools/gen-notices.py 从依赖真源
      # （gradle/libs.versions.toml ＋ 模块 build.gradle.kts ＋ rust/Cargo.lock）生成；
      # 这一步只判一致，依赖变了没重生成 ⇒ 红（420 实测手写清单必漂移：漏 32 / 陈旧 7）。
      # 与 423 分工：423 判「能不能用」，本步管「写清楚」。
      # 为什么排在 SBOM 之后（同 423）：许可取证读本地 Gradle 缓存 POM；缓存不全时由
      # tools/notices-evidence.json 的离线登记表兜底（带 POM 原文 / .crate checksum 绑定），
      # 两者都缺证据的坐标写「未取证」，不猜。生成器只替换两对 HTML 标记之间，
      # 资产类 / 说明文字 / 文末历史节（7 节已迁出）人工维护，不会被覆盖。
      - name: 第三方声明生成门禁（424：清单与依赖不一致 ⇒ 红）
        run: |
          python3 tools/gen-notices.py --selftest
          python3 tools/gen-notices.py --check

      # ── 任务 F（440）：资产许可门禁 —— 第一方名册 GZ-AG ＋ 第三方 ASSETS.md 双向校验 ──
      # 与任务 D/E 同级：**会红、会拦 CI**（不许 continue-on-error）。判据：
      #   · 名册（licenses/FIRST-PARTY.md，每条标 GZ-AG）命中 ⇒ 第一方，跳过许可判定，
      #     但文件必须真在 —— 名册有、assets/ 没有 ⇒ 红（名册过期，删了文件就删行）；
      #   · 名册外按第三方判：必须登记在 licenses/ASSETS.md 六列表且许可在允许表内，
      #     磁盘有、两本账都没有 ⇒ 红（漏登记）；
      #   · 同一文件不许同时在两表（两表冲突 ⇒ 红）；名册缺表头/被删 ⇒ 环境错误(2)。
      # 脚本不联网、不读 Gradle 缓存，排在任务 D/E 之后只是让同一类门禁挨在一起。
      - name: 资产许可门禁（440：第一方名册＋第三方登记，双向校验）
        run: |
          python3 tools/check-license-policy.py --assets --selftest
          python3 tools/check-license-policy.py --assets

      - name: 归档 SBOM
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: build/sbom/sbom-*.cdx.json
          retention-days: 14
          if-no-files-found: warn

      - name: 归档漏洞报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vuln-report
          # upload-artifact v4 不支持 `{md,json}` 花括号（v3 支持）⇒ 必须多行分别写。
          path: |
            build/supply-chain/vuln-report-*.md
            build/supply-chain/vuln-report-*.json
          retention-days: 14
          if-no-files-found: warn

      - name: 归档许可/版本报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: license-report
          path: |
            build/supply-chain/license-release-report-*.md
            build/supply-chain/license-release-report-*.json
          retention-days: 14
          if-no-files-found: warn
