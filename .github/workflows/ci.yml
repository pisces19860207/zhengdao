# 证道（Zhengdao）质量验证流水线
# 独立开发声明：本文件为本项目从零编写，未参考任何第三方同类项目的 CI 配置。
#
# 与 build.yml 的分工：
#   - build.yml   = 产物流水线（APK + RootFS + Releases 发布，重；发布路径已压到约 3 分钟，
#                   RootFS 只在 rootfs/ 有改动时才重建 —— 见 ERRATA E-029/E-030）
#   - ci.yml      = 质量验证（编译 + 全量单测 + Rust 单测 + R8 冒烟 + lint 报告，轻；
#                   main 上约 3.5 分钟；R8 冒烟在 main 上交给 build.yml，只在 PR/手动时跑）
#
# 触发：推送到 main、PR 到 main、手动。
# 失败语义：单测失败 / 编译失败 / R8 构建失败 → job 红（这就是抓回归的价值）。
# 历史：packageScope 撞名导致的 release 启动崩溃（e1269f0 修复）若有此流水线，
#       R8 冒烟虽抓不到运行时错误，但「R8 产物存在性 + 体积突变」能提供线索。

name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 —— 两条硬需求，缺一条就红：
          # ①「刷基线收窄门禁」（第㉗②-A 加分项）要能解析 HEAD~1；
          # ② 第三十三批「账本一致性门禁」的 D4（commit 短号可达）要在**本地对象库里**
          #    认得过台账/派工单引用到的每一个历史短号。
          # 2026-10-19 实测（E-162）：fetch-depth: 2 时 D4 把 1774 条历史短号全判成
          # `cat-file missing` —— 浅克隆里那些对象根本不存在，于是这道门禁量的是
          # 「CI 拉了多少历史」，不是「账对不对」。全历史 ≈ 67 MiB / 1990 提交，
          # 相对装 NDK + 跑 Gradle 是噪声；build.yml 一直用的就是 0。
          # 脚本侧另有硬守卫：浅克隆直接 exit 2 并指名原因，不再刷 1774 行假发现。
          fetch-depth: 0

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 授权 gradlew（CI 上无 local.properties，SDK 走 runner 预装）
        run: chmod +x gradlew

      - name: 缓存 Gradle（依赖 + wrapper）
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-ci-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-ci-${{ runner.os }}-

      # §B 57 第③条（第㉗②-A）：NDK 版本**单一真源 = app/build.gradle.kts 的 ndkVersion**。
      # 在这之前这里和 gradle 各写一遍 "27.2.12479018"：AGP 用 gradle 里那个编 native、
      # CI 装的是本文件里那个，两边可以各改各的而 CI 全绿 —— 版本一漂移就是
      # 「本机能编、CI 编不出」或反过来。现在两个消费者（本文件装 NDK、
      # tools/check-so-provenance.py 校验基线）都从 gradle 的同一行读。
      - name: 读取 NDK 版本（单一真源 = app/build.gradle.kts）
        run: |
          set -euo pipefail
          NDK_VERSION="$(sed -n 's/^[[:space:]]*ndkVersion[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "$NDK_VERSION" ]; then
            echo "::error title=NDK 版本读取失败::app/build.gradle.kts 里找不到 ndkVersion = \"…\"（§B 57 第③条的单一真源）"
            exit 1
          fi
          echo "NDK_VERSION=$NDK_VERSION" >> "$GITHUB_ENV"
          echo "NDK 版本（来自 app/build.gradle.kts）= $NDK_VERSION"

      - name: 安装 NDK（版本由 app/build.gradle.kts 决定）
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null

      # E-048：入库的 libzhengdao_core.so 是**人工** cargo build + llvm-strip 后拷进来的，
      # 两条 workflow 都不构建它；而 16KB 对齐漏掉、JNI 入口被 strip 掉都不会编译失败，
      # 只会在真机上「loadLibrary 失败 → isRustAvailable()=false → 悄悄退回 Java」。
      # 所以在这里把「对齐 + 入口符号」做成门禁（期望符号现读 CoreNative.kt，自动跟新方法）。
      - name: 入库 .so 门禁（16KB 页对齐 + JNI 入口符号）
        run: python3 tools/check-native-so.py

      # E-128：上面的门禁查不出「.so 是不是这份源码编的」；这里比对
      # tools/so-provenance.json 里的 .so sha256 + 源码树指纹基线。
      - name: 入库 .so 同源门禁（so 与 rust/core/src 同源基线）
        run: python3 tools/check-so-provenance.py

      # 第三十三批（派工单 §1-B）：文档账本一致性门禁。账是文档账（FEATURE-LEDGER + ERRATA + 派工单），
      # 编号重复/缺号/引用查不到/commit 短号不可达全靠人肉对账，漂移已真实发生过两次。
      # 这一步把那五条机器能判的做成会红的门禁；默认只报告，--strict 有发现即红。
      # 已知存量（上游 commit、CI run 号、续记同号等）登记在 tools/doc-ledger-allowlist.txt，
      # 条目不再触发时会报「可删除」——烂账要能清掉。不许 continue-on-error：这批就是为了拦事。
      - name: 账本一致性门禁（第三十三批）
        run: python3 tools/check-doc-ledger.py --strict

      # 第㉗②-A 加分项：同源门禁是**基线驱动**的，所以「只改 tools/so-provenance.json
      # 把哈希刷成当前值」能让它变绿而产物根本没重编。这一步把这条捷径堵上：
      # 基线动了，就必须同时有 .so 或 rust/core/src/** 跟着动。
      - name: 刷基线收窄门禁（改基线必须连带改 .so 或 rust/core/src）
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="HEAD~1"; fi
          python3 tools/check-baseline-refresh.py --base "$BASE"

      # 第二十三批 B 段（派工单 §2.3）：进化门禁进 CI 的第二半——**跑测试之前**先确认
      # 评测集与基线水位没被顺手放松（用例不许删；passRate/avgSteps/cases/passing 不许松）。
      # 顺序写死：校验必须排在 testDebugUnitTest 之前，否则测试烧完分钟数才发现基线被改松。
      # BASE 与上面「刷基线收窄门禁」同一变量、同一写法（PR 取 base.sha，否则 HEAD~1；
      # checkout 的 fetch-depth: 0（全历史）保证这两个 rev 都在本地对象库里）。
      - name: 评测基线不许放松门禁（cases 不许删、baseline 不许松）
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="HEAD~1"; fi
          python3 tools/check-eval-baseline.py --base "$BASE"

      - name: 编译 Debug APK（含 .so 打包验证）
        run: ./gradlew :app:assembleDebug --console=plain

      # E-105 的门禁：那次实测发现 AGP 打包**会剥掉构件顶层的 META-INF/LICENSE* / NOTICE***
      #   （commons-compress 有 LICENSE.txt/NOTICE.txt 却一个都没进 APK，zstd-jni 的 .so 进了
      #   包而它的 BSD-2 正文没进），所以「随构件分发」不能当承诺 —— 义务只能由我们自己随包
      #   放进 assets/licenses/。这一步把它变成会红的断言：仓库 licenses/ 里的每份正文都要在
      #   APK 里逐字节存在，并对 zstd 原生产物、okhttp 的 publicsuffixes.gz 这两处单独核。
      - name: 许可证正文门禁（APK assets/licenses/ 与仓库逐字节一致）
        run: python3 tools/check-licenses.py

      - name: 全量单元测试（失败即红）
        run: ./gradlew :app:testDebugUnitTest --console=plain

      # #1（2026-10-09）：仪器测试（androidTest）在本仓库**进不了 CI 的模拟器**——
      # 本包只打 arm64-v8a（app/build.gradle.kts:103-110，用户 2026-10-06 定案「不做
      # x86_64 模拟器支持」），GitHub runner 上的 x86_64 模拟器装不上这个包。
      # 但 androidTest 源码长期「没人编译」的风险是真的：重构一下就会悄悄坏掉，
      # 等真机上跑才发现。所以这里只保证它**能编译**；存储读写那条真机冒烟用例在
      # app/src/androidTest/java/com/example/zhengdao/storage/StorageReadWriteSmokeTest.kt，
      # 跑法写在它的类注释里。
      - name: 编译仪器测试 APK（androidTest 至少必须能编译）
        run: ./gradlew :app:assembleDebugAndroidTest --console=plain

      - name: 缓存 cargo（Rust 逻辑层单测用；key 走已入库的 rust/Cargo.lock）
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # 第㊶刀（2026-10-15；㉗② 方案 A′ → **B3+ 按主机基线**）：从当前源码**重新编一遍** .so，与
      #   本主机那份归一化基线逐字节比对（ubuntu ⇒ tools/so-repro-baseline-ci.json）
      #   —— 补上「基线可自刷」之外最后一环：产物必须真能从这份源码编出来（既有三道门禁都只验
      #   「库里的东西对不对」，没有一道验「这份源码能不能编出这个库」）。
      #   ⚠️ 实测**跨主机不可逐字节复现**（Windows 与 ubuntu 差 160 B：.text/.rodata/.rela.dyn/
      #   .eh_frame*/.dynsym 内容不同，补全 sysroot/rustup/临时 target 的 remap 也不变）
      #   ⇒ 门禁按主机各自钉基线；用户 2026-10-15 拍板 B3+（证据：证道设计报告/证道-第41刀…md）。
      #   本主机第一次跑（还没有它那份基线）**不判红**：脚本把整份基线以 base64 打进 ::notice 再退出 2。
      #   ✅ **硬门禁**（2026-10-15 深夜转正）：`e2d1313` 那次 run 已打出「与 tools/so-repro-baseline-ci.json
      #   逐字节一致 ✔」（verify success），观察期结束 ⇒ 摘掉 continue-on-error。本步从此判红即 CI 判红。
      #   读数走 ::notice / ::warning annotation：本仓库 Actions 日志未登录读不到，而
      #   check-runs annotations 接口**匿名可读**（同 Rust 单测段的处置，见 ERRATA E-028）。
      #   本机（Windows）与 CI（ubuntu）的差异由脚本自己注入：NDK 的 linker / CC / AR 路径
      #   按本机 SDK 现拼（rust/.cargo/config.toml 里那些是 Windows 绝对路径），
      #   归一化前缀＝sysroot / rustup home / cargo home / 仓库根 / 临时 target 目录。
      - name: 重编比对 lane（第㊶刀 · B3+ 按主机基线：硬门禁）
        run: |
          python3 tools/rebuild-and-compare.py

      # 这 8 例（sha256 4 + extract 4）是解压主路径的安全网，此前只在人手动跑过：
      # 本机 cargo test 需要 host C 编译器（Windows 上还得 w64devkit 在 PATH，见 ERRATA E-027），
      # 而 ci/build 两条流水线里从来没有 cargo 步骤 —— 放到 ubuntu runner（自带 gcc）最省事。
      #
      # 失败时把要点抛成 annotation：本仓库的 Actions 日志未登录读不到，
      # 而 `GET /repos/{owner}/{repo}/check-runs/{id}/annotations` 是匿名可读的
      # （首次把这一步接进 CI 就是靠它才看到平台差异的原文，见 ERRATA E-028）。
      - name: Rust 逻辑层单测（PC 层纯逻辑，失败即红）
        run: |
          cd rust
          set +e
          cargo test -p zhengdao_core --release 2>&1 | tee /tmp/cargo-test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -E '(^error|^warning: unused|FAILED|panicked|assertion|^ *-->|left:|right:)' /tmp/cargo-test.log \
              | tail -n 8 | while IFS= read -r line; do
                  echo "::error title=cargo test 失败::${line}"
                done
            echo "::error title=cargo test::退出码 ${code}（完整输出见本步骤日志）"
          fi
          exit "$code"

      - name: 归档单测报告（无论成败都上传）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
          if-no-files-found: warn

      # ⚠️ ERRATA E-030：main 分支上这一步与 build.yml 的「编译 Release APK」完全重复
      #    （那边还多一道"对着产物验签名"的硬关卡），而 build.yml 每次推 main 都会跑
      #    ⇒ 这里只在 PR 与手动触发时跑，省下 2 分钟；PR 上仍保留"R8 能不能编"的快反馈。
      - name: R8 冒烟（release 可构建——验证混淆/资源收缩不炸）
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        # 只验「混淆 + 资源收缩会不会炸」，产物**不发布**，所以放行 build.gradle.kts 里那道
        # 「没有发版钥匙就不许打 release 包」的断言（CI 的发布路径由 build.yml 把关：还原正式
        # 钥匙时对指纹 + assembleRelease 之后 apksigner 验产物）。
        run: ./gradlew :app:assembleRelease --console=plain -PallowDebugSignedRelease

      # E-072：R8 究竟把哪个类/方法改了名，唯一的地面真值是构建产物 mapping.txt —— 单测和
      #   .so 门禁都够不到它。这一步把"关键类未被改名 + onProgress 保住"变成会红的断言
      #   （E-022 就是 onProgress 被改名导致 release 一装环境就 SIGABRT）。
      # ⚠️ 必须紧跟 assembleRelease（上面那步），不能挂到只跑单测的 job 上——否则找不到产物。
      - name: R8 产物断言（关键类未被改名 + onProgress 保住）
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: python3 tools/check-r8-mapping.py

      - name: 上传 release APK（冒烟产物，保留 7 天）
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: zhengdao-release-smoke
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: warn

      - name: Android Lint（报告-only，不阻塞；报告入 artifact）
        if: always()
        run: ./gradlew :app:lintDebug --console=plain || echo "lint 有告警，报告见 artifact"

      - name: 归档 lint 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14
          if-no-files-found: ignore
