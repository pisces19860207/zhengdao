# 证道（Zhengdao）质量验证流水线
# 独立开发声明：本文件为本项目从零编写，未参考任何第三方同类项目的 CI 配置。
#
# 与 build.yml 的分工：
#   - build.yml   = 产物流水线（APK + RootFS + Releases 发布，重；发布路径已压到约 3 分钟，
#                   RootFS 只在 rootfs/ 有改动时才重建 —— 见 ERRATA E-029/E-030）
#   - ci.yml      = 质量验证（编译 + 全量单测 + Rust 单测 + R8 冒烟 + lint 报告，轻；
#                   main 上约 3.5 分钟；R8 冒烟在 main 上交给 build.yml，只在 PR/手动时跑）
#
# 触发：推送到 main、PR 到 main、手动。
# 失败语义：单测失败 / 编译失败 / R8 构建失败 → job 红（这就是抓回归的价值）。
# 历史：packageScope 撞名导致的 release 启动崩溃（e1269f0 修复）若有此流水线，
#       R8 冒烟虽抓不到运行时错误，但「R8 产物存在性 + 体积突变」能提供线索。

name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 授权 gradlew（CI 上无 local.properties，SDK 走 runner 预装）
        run: chmod +x gradlew

      - name: 缓存 Gradle（依赖 + wrapper）
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-ci-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-ci-${{ runner.os }}-

      - name: 安装 NDK r27.2（externalNativeBuild 需要 termux JNI）
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null

      # E-048：入库的 libzhengdao_core.so 是**人工** cargo build + llvm-strip 后拷进来的，
      # 两条 workflow 都不构建它；而 16KB 对齐漏掉、JNI 入口被 strip 掉都不会编译失败，
      # 只会在真机上「loadLibrary 失败 → isRustAvailable()=false → 悄悄退回 Java」。
      # 所以在这里把「对齐 + 入口符号」做成门禁（期望符号现读 CoreNative.kt，自动跟新方法）。
      - name: 入库 .so 门禁（16KB 页对齐 + JNI 入口符号）
        run: python3 tools/check-native-so.py

      - name: 编译 Debug APK（含 .so 打包验证）
        run: ./gradlew :app:assembleDebug --console=plain

      - name: 全量单元测试（失败即红）
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: 缓存 cargo（Rust 逻辑层单测用；key 走已入库的 rust/Cargo.lock）
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # 这 8 例（sha256 4 + extract 4）是解压主路径的安全网，此前只在人手动跑过：
      # 本机 cargo test 需要 host C 编译器（Windows 上还得 w64devkit 在 PATH，见 ERRATA E-027），
      # 而 ci/build 两条流水线里从来没有 cargo 步骤 —— 放到 ubuntu runner（自带 gcc）最省事。
      #
      # 失败时把要点抛成 annotation：本仓库的 Actions 日志未登录读不到，
      # 而 `GET /repos/{owner}/{repo}/check-runs/{id}/annotations` 是匿名可读的
      # （首次把这一步接进 CI 就是靠它才看到平台差异的原文，见 ERRATA E-028）。
      - name: Rust 逻辑层单测（PC 层纯逻辑，失败即红）
        run: |
          cd rust
          set +e
          cargo test -p zhengdao_core --release 2>&1 | tee /tmp/cargo-test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -E '(^error|^warning: unused|FAILED|panicked|assertion|^ *-->|left:|right:)' /tmp/cargo-test.log \
              | tail -n 8 | while IFS= read -r line; do
                  echo "::error title=cargo test 失败::${line}"
                done
            echo "::error title=cargo test::退出码 ${code}（完整输出见本步骤日志）"
          fi
          exit "$code"

      - name: 归档单测报告（无论成败都上传）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
          if-no-files-found: warn

      # ⚠️ ERRATA E-030：main 分支上这一步与 build.yml 的「编译 Release APK」完全重复
      #    （那边还多一道"对着产物验签名"的硬关卡），而 build.yml 每次推 main 都会跑
      #    ⇒ 这里只在 PR 与手动触发时跑，省下 2 分钟；PR 上仍保留"R8 能不能编"的快反馈。
      - name: R8 冒烟（release 可构建——验证混淆/资源收缩不炸）
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: ./gradlew :app:assembleRelease --console=plain

      - name: 上传 release APK（冒烟产物，保留 7 天）
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: zhengdao-release-smoke
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
          if-no-files-found: warn

      - name: Android Lint（报告-only，不阻塞；报告入 artifact）
        if: always()
        run: ./gradlew :app:lintDebug --console=plain || echo "lint 有告警，报告见 artifact"

      - name: 归档 lint 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14
          if-no-files-found: ignore
