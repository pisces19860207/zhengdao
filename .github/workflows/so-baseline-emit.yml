# 证道（Zhengdao）—— 「ubuntu 同源基线」一键重取（手动触发）
# 独立开发声明：本文件为本项目原创，不含对第三方源码的拷贝。
#
# 为什么有这个工作流
#   tools/rebuild-and-compare.py 按主机各钉一份基线（B3+：Windows 与 ubuntu 产物不能逐字节
#   复现，见该脚本文件头与 ERRATA E-028/E-041）。改了 rust/core/src 之后 ubuntu 重编的字节
#   必然与旧基线不同 ⇒ ci.yml 第 18 步「重编比对 lane」判红。
#   过去取新基线要「删基线 → 等 CI 跑一轮把 base64 打进 annotation → 手工解码回填」，
#   两轮往返还容易抄错。本工作流把这件事压成一次手动触发：
#     ① 在 runner 上跑 --update 重写 tools/so-repro-baseline-ci.json；
#     ② 立刻用新基线再比对一次（必须逐字节一致，否则说明这台机器今天不可复现，直接红）；
#     ③ 把基线文件作为 artifact 传出来 —— 下载后原样替换仓库里那份即可，无需解码。
#
# 用法
#   Actions → so-baseline-emit → Run workflow（reason 随便写一句，会进 job summary）。
#   跑完在页面底部下载 artifact `so-repro-baseline-ci`，把里面的
#   `tools/so-repro-baseline-ci.json` 覆盖回仓库，提交信息里写明「按 so-baseline-emit 重取」。
#
# 与 ci.yml 的关系
#   同名步骤（JDK / NDK 版本 / 触发条件）刻意与 ci.yml 对齐，避免两边环境漂移；
#   ci.yml 里那条 lane 的失败提示已指向本工作流。

name: so-baseline-emit

on:
  workflow_dispatch:
    inputs:
      reason:
        description: '为什么重取基线（会写进 job summary）'
        required: false
        default: 'rust/core/src 改动后重编字节变化'

jobs:
  emit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 安装 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # 与 ci.yml 的「装 NDK」同一份口径：cargo 交叉编译 aarch64 要用 NDK 的 linker/CC/AR
      - name: 装 NDK（重编 lane 需要，同 ci.yml）
        run: |
          NDK_VER="27.2.12479018"
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -d "$SDK/ndk/$NDK_VER" ]; then echo "NDK $NDK_VER 已在：$SDK/ndk/$NDK_VER"; exit 0; fi
          for i in 1 2 3; do
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VER" >/dev/null 2>&1 && break
            echo "第 $i 次装 NDK 失败，重试…"; sleep 5
          done
          test -d "$SDK/ndk/$NDK_VER" || { echo "::error::NDK $NDK_VER 装不上（重编 lane 需要它）"; exit 1; }

      - name: 重取基线（tools/rebuild-and-compare.py --update）
        run: python3 tools/rebuild-and-compare.py --update

      # 自证：拿刚写下的基线再比对一次。不一致就红 —— 那说明这台 runner 今天不可复现，
      # 基线不能拿去用（宁可这次手动任务失败，也不要把不可复现的字节钉进仓库）。
      - name: 自证（用新基线再比对一次，必须逐字节一致）
        run: python3 tools/rebuild-and-compare.py

      - name: 摘要（复制进提交信息）
        run: |
          {
            echo "### so-baseline-emit 结果"
            echo ""
            echo "- reason: ${{ github.event.inputs.reason }}"
            echo "- head: \`${GITHUB_SHA}\`"
            echo "- 文件: \`tools/so-repro-baseline-ci.json\`"
            echo "- 字节数: $(wc -c < tools/so-repro-baseline-ci.json)"
            echo "- sha256: \`$(sha256sum tools/so-repro-baseline-ci.json | cut -d' ' -f1)\`"
            python3 -c "import json;d=json.load(open('tools/so-repro-baseline-ci.json'));print('- normalized: %d B / \`%s\`' % (d['normalized']['size'], d['normalized']['sha256']))"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 上传基线（下载它，原样覆盖回仓库同名文件）
        uses: actions/upload-artifact@v7
        with:
          name: so-repro-baseline-ci
          path: tools/so-repro-baseline-ci.json
          if-no-files-found: error
