# 证道（Zhengdao）CI 构建流水线
# 独立开发声明：本文件为本项目原创，不含对第三方源码的拷贝。
# 参考资料：GitHub Actions 官方文档（workflow syntax / runner images / upload-artifact）。
#
# 触发：推送到 main 分支，或在 Actions 页面手动触发（workflow_dispatch）。
# 产物（构建完成后在本页 Artifacts 区下载，按用途分三个目录）：
#   - apk-debug/zhengdao-<版本>-debug.apk      应用调试包（开发者用；未混淆、体积大、可被调试）
#   - apk-release/zhengdao-<版本>-release.apk  正式包（最终用户用；R8 混淆 + 资源收缩）
#   - rootfs-files/debian-13.7-base-arm64.tar.zst  RootFS 包 + .sha256（M1.1 真机测试用）
#
# ⚠️ 本流水线**不再构建 proot**。原来那一步从上游 proot-me/proot master 自编译出
#    rootfs-files/proot-arm64，但那个文件在应用代码里 0 引用——App 真正的 proot 是
#    app/src/main/assets/proot/ 下的 Termux 官方发行二进制（5.1.107.96，由
#    terminal/ProotLauncher.kt:164-169 按 SHA256 钉死后释放）。设计与 PROVENANCE
#    一直要求「用 Termux 官方产物、不要退回自编译上游版」，CI 这一步与它矛盾。
#    2026-10-07 移除，见 docs/ERRATA.md E-016。
#
# ⚠️ debug 包与 release 包**必须分目录**：早先两者同处 artifacts/，导致
#    `gh release upload latest artifacts/*` 把 debug 包一并推给最终用户，
#    而 tag 触发的 release job 还把 debug 包改名成 app-release.apk 冒充正式版。
#    见 docs/ERRATA.md E-013。
#
# 说明：
#   - RootFS 步骤在 x86_64 runner 上经 qemu-user-static 交叉构建 arm64，
#     受模拟开销影响约需 30–90 分钟；该步失败不阻塞 APK 产物上传（continue-on-error）。
#   - local.properties 是本机文件，CI 上无效且有害，构建前删除。
#
# ⚠️ 步骤顺序有讲究（2026-10-08 修，见 docs/ERRATA.md E-029 / E-030）：
#    编译 Release APK → 校验产物签名 → 收集 APK → **发布 APK 到 Releases** →
#    编译 Debug APK → 构建 RootFS → 发布 RootFS 包 →（诊断）。
#    原则：**凡是用户能下载到的东西，挡在它前面的步骤越少越好**。
#    「发布」绝不能再排在 30–90 分钟的 RootFS 后面：本工作流有
#    `cancel-in-progress: true`（同一 ref 只留最新一次），任何人一推送就会把正在跑的
#    run 掐死，排在长步骤后面的发布步骤因此**永远走不到**——2026-10-08 当天所有修复
#    都没能进滚动版 latest，下载页一直停在 10-07 的包，根因就在这个顺序（E-029）。
#    同理，Debug APK（开发者用，实测 54 秒）与那份 keystore 诊断（实测 154 秒，
#    E-014 排查期留下的常驻诊断）都挪到了发布**之后**：它们只影响 Actions 页的
#    artifact 与排查，不该挡在用户下载前面（E-030）。
#
# ⚠️ RootFS 也不再每次推送都重建：只有 `rootfs/` 有改动、或手动触发（workflow_dispatch）、
#    或拿不到 `github.event.before`（tag 推送/强制推送，保守处理）时才重建；纯 App 代码
#    与文档改动会跳过它，省下 30–90 分钟。判定见「判断本次推送要不要重建 RootFS」。
#
# ⚠️ 必须配置签名 secret（两把钥匙，见 docs/ERRATA.md E-014 / E-099）：
#    ① **正式包**用 `RELEASE_KEYSTORE_B64` + `RELEASE_KEYSTORE_PASSWORD` + `RELEASE_KEY_ALIAS`
#       （2026-10-11 启用的独立 release keystore，证书 SHA-256 = B93169F2…86EC2）；
#    ② **debug 包**（开发者用）继续用 `DEBUG_KEYSTORE_B64`（= 存量旧包那把 debug keystore，
#       证书 SHA-256 = 44E2FE86…A3BE18）。
#    runner 每次都是全新的、keystore 不在缓存里，AGP 找不到就随机生成新 key，
#    那样每个 CI 产物签名都不同、互相装不上（见 docs/ERRATA.md E-014）。
#    未配置时：main 的滚动版**跳过 APK 上传**，tag 的正式发布**硬失败**。
#
# ⚠️ 2026-10-11 换正式钥匙的**已知代价**：签名与旧包不同 ⇒ 已装旧包的用户必须**卸载重装一次**
#    （App 私有目录被清 = Debian 环境要重下；共享存储里的工作区/资料不受影响）。用户已拍板接受
#    （当时 GitHub 上只有他一个用户、没有存量包袱，见 ERRATA E-099）。

name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]   # 推 v 开头 tag 时也触发，用于自动创建正式 Release
  workflow_dispatch:

# 同 ci.yml：main 上排队跑完，PR 才取消（2026-10-26）。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write   # 允许 CI 把产物发布到 Releases 页
    steps:
      - name: 检出代码
        # fetch-depth: 0 —— 下面那步要拿 `github.event.before` 和本次 sha 做 `git diff`
        # 判断 `rootfs/` 有没有变。默认的浅克隆里没有 before 提交，判定会退化成"每次都重建"。
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 判断本次推送要不要重建 RootFS
        # 2026-10-28：**RootFS 构建已随终端搬去 zhengdao-term**（本仓 rootfs/ 已删）。
        # 这里恒输出 false：既避免手动触发时去跑一个不存在的 build-rootfs.sh（A-P1-5/B-2），
        # 也保留这条判定步骤的位置与输出名，下游 if 条件不用改（以后真要回来再恢复判定逻辑）。
        id: rootfs_needed
        run: |
          echo "rootfs=false" >> "$GITHUB_OUTPUT"
          echo "本次是否需要重建 RootFS：false（RootFS 已随终端搬去 zhengdao-term，本仓不再构建）"

      - name: 安装 JDK 21（Gradle 启动器用；守护进程按项目配置经 foojay 自动供给 JDK 25）
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 NDK r27.2（与 app/build.gradle.kts 的 ndkVersion 一致）
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
          ls "$ANDROID_HOME/ndk"

      - name: 清理本机配置并授权 gradlew
        run: |
          rm -f local.properties
          chmod +x gradlew

      - name: 缓存 Gradle（依赖 + wrapper + 自动供给的 JDK）
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/jdks
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: 还原 debug 签名密钥（让 CI 产物与存量用户同签名，可覆盖安装）
        # ⚠️ 见 docs/ERRATA.md E-014：runner 每次都是全新的，而 ~/.android/debug.keystore
        #    **不在任何缓存里**，AGP 找不到就随机生成一把新 key → 每个 CI 产物的签名都不同 →
        #    用户升级时 INSTALL_FAILED_UPDATE_INCOMPATIBLE，只能卸载重装
        #    （= filesDir 全删 = Debian 环境重下）。
        #    所以必须从 secret **确定性地**还原"存量用户已经装上的那一把"。
        #    本步刻意不硬失败：secret 未配置时 main 的日常构建仍要能绿。
        #    正式版由 release job 把关（没配 secret 就不许发）；滚动版由下面"发布 APK 到 Releases"把关。
        env:
          KS_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
          # 期望的证书指纹 = 存量用户已安装的那把 key（见 E-014 第 1 节的对照表）
          EXPECTED_SHA256: 44E2FE86B1F62A9FDB2E86805FE0A4DAE7CAD0C3024DBF6AF84D0C45B5A3BE18
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::未配置 secret DEBUG_KEYSTORE_B64，本次用 runner 随机生成的 keystore——产物无法覆盖安装既有版本（E-014）"
            exit 0
          fi
          # ⚠️ AGP 去哪个目录找 debug keystore，取决于 runner 上的 Android 环境变量：
          #    ANDROID_USER_HOME 存在 → 直接用它的值当"Android 用户目录"（不再拼 .android）；
          #    否则 ANDROID_PREFS_ROOT → 拼 .android；再否则 → $HOME/.android。
          #    E-014 §7/§8 记的正是这个坑：只写 $HOME/.android 时，本步指纹检查全绿、
          #    可打出来的包却是**另一把随机 key** 签的（实测 44e2fe86… → 18e5268a… → 9409433d…）。
          #    ⇒ 结论：**不再依赖 AGP 的目录推断**。权威副本写到 workspace 下的固定路径，
          #      由环境变量 ZHENGDAO_KEYSTORE_FILE 显式告诉 Gradle（app/build.gradle.kts 顶部）；
          #      下面几个候选目录仍然照写，纯属保险。
          echo "== 与 Android 用户目录有关的 env =="
          env | grep -iE '^(ANDROID|HOME|USERPROFILE)' | sort || true
          # ① 权威副本：路径由本文件确定，Gradle 侧用它覆盖 AGP 内建 debug 签名配置的 storeFile
          CANON="$GITHUB_WORKSPACE/.ci-debug.keystore"
          printf '%s' "$KS_B64" | base64 -d > "$CANON"
          echo "已写入权威副本: $CANON ($(stat -c%s "$CANON") 字节)"
          # ② 保险：AGP 可能去找的那几个目录
          dirs="$HOME/.android"
          if [ -n "${ANDROID_USER_HOME:-}" ]; then
            dirs="$dirs $ANDROID_USER_HOME $ANDROID_USER_HOME/.android"
          fi
          if [ -n "${ANDROID_PREFS_ROOT:-}" ]; then
            dirs="$dirs $ANDROID_PREFS_ROOT/.android"
          fi
          if [ -n "${ANDROID_SDK_HOME:-}" ]; then
            dirs="$dirs $ANDROID_SDK_HOME/.android"
          fi
          for d in $dirs; do
            mkdir -p "$d"
            cp "$CANON" "$d/debug.keystore"
            echo "已写入: $d/debug.keystore ($(stat -c%s "$d/debug.keystore") 字节)"
          done
          # 光有文件不够——secret 里放的可能是**另一把** key（比如谁新生成了一份）。
          # 那种情况下所有 CI 产物照样装不上存量版本，而且照样"一切正常"。所以比指纹。
          FP="$(keytool -list -v -keystore "$CANON" \
                  -storepass android -alias androiddebugkey 2>/dev/null \
                | grep -m1 'SHA256:' \
                | sed 's/.*SHA256: *//' \
                | tr -d ':' | tr 'a-f' 'A-F')"
          echo "keystore 证书 SHA-256 = $FP"
          if [ "$FP" != "$EXPECTED_SHA256" ]; then
            echo "::error::DEBUG_KEYSTORE_B64 里的不是存量那把 key（期望 $EXPECTED_SHA256）——这样发出去的包老用户装不上，见 docs/ERRATA.md E-014"
            exit 1
          fi
          # ⚠️ 到这里为止只证明"**钥匙文件**是对的"。钥匙文件对 ≠ 打出来的包对 ——
          #    真正的关卡在 assembleRelease 之后那一步「校验 release 包的签名」（E-014 §7）。

      - name: 还原正式 release 签名密钥（正式包用它签；2026-10-11 起，见 ERRATA E-099）
        # 为什么换：原来 release 与 debug 共用同一把 debug keystore（E-013/E-014 的遗留），
        #   "正式包"与"开发者本地随手打的包"因此同签名，也没给将来轮换留余地。
        # 代价（明写在案）：签名变了 ⇒ 已装旧包的用户必须**卸载重装一次**（App 私有目录被清）。
        # ⚠️ 与上一步不同，本步**硬失败**：拿不到正式钥匙就不许往下走 —— 否则 release 包会被
        #   runner 随机 key 签，用户必须卸载重装，而 CI 照样"全绿"（E-014 §7 的教训）。
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          # 期望指纹 = 那把正式 release keystore 的证书（本机 .zhengdao-keys/zhengdao-release.jks）
          EXPECTED_SHA256: B93169F211C6B3D9FDAE36B2C614C23BEF28EAE3582E4D8BCA0657C27AC86EC2
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::未配置 RELEASE_KEYSTORE_B64 / RELEASE_KEYSTORE_PASSWORD —— 正式包会被随机 key 签，用户必须卸载重装（docs/ERRATA.md E-099）"
            exit 1
          fi
          CANON="$GITHUB_WORKSPACE/.ci-release.keystore"
          printf '%s' "$KS_B64" | base64 -d > "$CANON"
          echo "已写入权威副本: $CANON ($(stat -c%s "$CANON") 字节)"
          FP="$(keytool -list -v -keystore "$CANON" \
                  -storepass "$KS_PASS" -alias "${KS_ALIAS:-zhengdao}" 2>/dev/null \
                | grep -m1 'SHA256:' \
                | sed 's/.*SHA256: *//' \
                | tr -d ':' | tr 'a-f' 'A-F')"
          echo "release keystore 证书 SHA-256 = $FP"
          if [ "$FP" != "$EXPECTED_SHA256" ]; then
            echo "::error::RELEASE_KEYSTORE_B64 里不是那把正式 key（期望 $EXPECTED_SHA256，实际 $FP）——见 docs/ERRATA.md E-099"
            exit 1
          fi

      # E-048：与 ci.yml 同一道门禁，放在这里是因为"入库的 .so 是人工拷进来的"——
      # 发布路径自己也得挡住"16KB 对齐漏了 / JNI 入口被 strip 掉"这两类静默降级
      # （它们不会让编译失败，只会让真机悄悄退回 Java 路径）。
      - name: 入库 .so 门禁（16KB 页对齐 + JNI 入口符号）
        run: python3 tools/check-native-so.py

      - name: 编译 Release APK（最终用户用；R8 + 资源收缩 + lintVital）
        # ⚠️ 这一步是本流水线以前**没有**的，正是它缺席让 CI 发布的「正式版」实为 debug 包
        #    （见 docs/ERRATA.md E-013）。签名走 AGP 内建的 "debug" 签名配置
        #    （app/build.gradle.kts:82 `signingConfig = signingConfigs.getByName("debug")`，
        #     名字是历史遗留，实际含义是"由 ZHENGDAO_KEYSTORE_FILE 指定的那一份"）——
        #    2026-10-11 起这里指向**正式 release keystore**（上一步还原出的 .ci-release.keystore）。
        #    CI 每次全新 runner，AGP 找不到 keystore 会随机生成新 key、产出装不上的包（E-014），
        #    所以上面两步「还原 debug / 还原正式 release 签名密钥」是这一步能用的前提；
        #    ZHENGDAO_KEYSTORE_FILE 等环境变量则保证 Gradle **用的是还原进去的那一份**（E-014 §8）。
        #    这一步失败会让整个 job 变红（这是刻意的）：宁可 CI 红，也不要再悄悄发调试包。
        env:
          ZHENGDAO_KEYSTORE_FILE: ${{ github.workspace }}/.ci-release.keystore
          ZHENGDAO_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ZHENGDAO_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ZHENGDAO_KEY_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleRelease --console=plain

      # E-072：R8 究竟把哪个类/方法改了名，唯一的地面真值是构建产物 mapping.txt ——
      #   单测（R8KeepRuleGuardTest 只读 proguard 文本）与 check-native-so.py（只读 .so 符号）
      #   都够不到它。这一步把"关键类未被改名 + onProgress 保住"变成会红的断言
      #   （E-022：onProgress 被 R8 改名 ⇒ release 一装环境就 SIGABRT）。
      #   必须紧跟 assembleRelease——它才有 mapping.txt；挂在别处就成了永远跳过的假门禁。
      - name: R8 产物断言（关键类未被改名 + onProgress 保住）
        run: |
          # 2026-10-27：先打一份 map 文件清单——上一轮红在"没有 mapping.txt"，但 Release APK 那步成功，
          # 得先看清 AGP 把 mapping 落到哪儿了。
          find app/build/outputs -name 'mapping*' -o -name 'seeds*' | head -20 || true
          python3 tools/check-r8-mapping.py

      - name: 校验 release 包的签名真的是那把正式 release key（验**产物**，不验替身）
        # ⚠️ 见 docs/ERRATA.md E-014 §7 与 E-099。上面那两步「还原签名密钥」只证明了**钥匙文件对**；
        #    2026-10-07 实测就是这个坑——「还原」那步全绿、密钥指纹逐字符吻合，打出来的包却是
        #    `18e5268a…`（另一把 key），发到 latest 之后老用户照样 INSTALL_FAILED_UPDATE_INCOMPATIBLE。
        #    "签名"是最终属性，只能对着最终产物验。所以这一步直接读 APK 里的证书。
        #    位置刻意排在「发布 APK 到 Releases」之前：指纹不对就让 run 红 —— 宁可不发，
        #    也不要再往 latest 扔一个装不上的包。
        env:
          EXPECTED_SHA256: B93169F211C6B3D9FDAE36B2C614C23BEF28EAE3582E4D8BCA0657C27AC86EC2
        run: |
          APK="$(ls app/build/outputs/apk/release/zhengdao-*-release.apk | head -1)"
          echo "被验的产物: $APK ($(stat -c%s "$APK") 字节)"
          APKSIGNER="$(command -v apksigner || true)"
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER="$(ls -d "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          fi
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::找不到 apksigner，无法校验产物签名（这一步是 E-014 §7 的硬关卡，不能跳过）"
            exit 1
          fi
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apksigner-out.txt
          FP="$(grep -m1 'SHA-256 digest' /tmp/apksigner-out.txt | awk '{print $NF}' | tr -d ':' | tr 'a-f' 'A-F')"
          echo "产物证书 SHA-256 = $FP"
          if [ "$FP" != "$EXPECTED_SHA256" ]; then
            echo "::error::打出来的包不是那把正式 release key 签的（期望 $EXPECTED_SHA256，实际 $FP）——发出去用户装不上，见 docs/ERRATA.md E-014 §7 / E-099"
            exit 1
          fi
          echo "✅ 产物签名 = 正式 release key（$EXPECTED_SHA256），可以发布。"

      - name: 收集 APK 产物（此刻只收 release —— 发布路径越短越好）
        # 三个目录各司其职：apk-debug 只给开发者从 Actions 页面下，
        # apk-release 才进 Releases 页，rootfs-files 是 RootFS 包。
        # 混在一个目录里，下面的 gh release upload 就会把 debug 包一起推出去（E-013）。
        # ⚠️ 这一步必须排在「发布 APK 到 Releases」之前，而发布又必须排在 RootFS 与
        #    Debug APK 之前（E-029/E-030）：此刻 debug 包还没编，先建空目录占位，
        #    等发布之后那步「收集 Debug APK 产物」再补进去（artifact 上传时才有它）。
        run: |
          mkdir -p apk-debug apk-release rootfs-files
          cp app/build/outputs/apk/release/zhengdao-*-release.apk apk-release/
          ls -la apk-release/

      - name: 发布 APK 到 Releases（最终用户从这里下载，和太墟一样的姿势）
        # ⚠️ E-029：这一步**刻意排在 RootFS 构建之前**。它以前排在 30–90 分钟的 qemu
        #    构建后面，于是任何一次新推送都会被 concurrency.cancel-in-progress 掐死在
        #    RootFS 那一步，发布永远走不到（2026-10-08：当天修复全都没进 latest）。
        #    签名硬关卡（上面「校验 release 包的签名真的是存量那把 key」）已经在它之前跑过，
        #    所以"先发 APK"是安全的。
        # 仅 main 分支更新滚动版 latest；推 tag 时不更新（正式版由 release job 创建）。
        # ⚠️ 只上传 apk-release/：debug 包绝不能出现在 Releases 页（E-013）。
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 只判存在性，不把密钥本身带进这一步
          KS_READY: ${{ secrets.RELEASE_KEYSTORE_B64 != '' }}
        run: |
          gh release view latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create latest --repo "$GITHUB_REPOSITORY" \
              --title "证道 · 最新构建" --latest \
              --notes "main 分支每次构建成功后自动更新的最新产物。App 内的下载地址已内置。"
          # 没配签名密钥时不发 APK：一份随机 key 签的包会让用户被迫卸载重装（E-014），
          # 宁可滚动版停在旧包上，也不要发一份装不上的。
          if [ "$KS_READY" = "true" ]; then
            gh release upload latest apk-release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "::warning::未配置 RELEASE_KEYSTORE_B64，跳过 APK 上传（E-014 / E-099）——用随机 key 签的包会迫使用户卸载重装"
          fi

      - name: 编译 Debug APK（开发者用）
        # ZHENGDAO_KEYSTORE_FILE 见 app/build.gradle.kts 顶部与 docs/ERRATA.md E-014 §8：
        # 把签名钥匙钉死在权威副本上，不再赌 AGP 的目录推断。
        # ⚠️ E-030：刻意排在「发布 APK 到 Releases」**之后**——它只是给开发者从 Actions
        #    页面下的调试件（实测 54 秒），不该挡在"用户能下载"前面。
        env:
          ZHENGDAO_KEYSTORE_FILE: ${{ github.workspace }}/.ci-debug.keystore
        run: ./gradlew :app:assembleDebug --console=plain

      - name: 收集 Debug APK 产物（发布之后才补进 artifact）
        run: |
          cp app/build/outputs/apk/debug/zhengdao-*.apk apk-debug/
          ls -la apk-debug/

      - name: 上传产物（开发者用，需登录）
        uses: actions/upload-artifact@v7
        with:
          name: zhengdao-build-${{ github.run_number }}
          path: |
            apk-debug/
            apk-release/
            rootfs-files/
          retention-days: 14
          if-no-files-found: error

      - name: 诊断（仅失败/手动触发时跑）：AGP 到底认哪把 keystore
        # ⚠️ E-014 §8 的根因至今**未定论**：钥匙文件放对了、指纹也对，产物却是别的 key 签的。
        #    这一步把「AGP 自己报出来的 store 路径 + 全盘 debug.keystore」打进日志——
        #    出了事一眼定案，不用再猜；手动触发时也跑一次（保住"常驻诊断"的能力）。
        # ⚠️ E-030：它是一次完整的 Gradle 调用（实测 154 秒），以前**每次构建**都跑；
        #    而真正的把关是「校验 release 包的签名」——那一步对着**产物**验（E-014 §7）。
        #    所以它从"每次"改成"仅失败/手动"，并挪到发布之后，不再挡在用户下载前面。
        if: failure() || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          ZHENGDAO_KEYSTORE_FILE: ${{ github.workspace }}/.ci-release.keystore
        run: |
          echo "== AGP 报的签名配置（release 变体应指向 .ci-release.keystore）=="
          ./gradlew :app:signingReport --console=plain 2>&1 | grep -A3 -iE '^(Variant|Config|Store|Alias)|SHA-?1' || true
          echo "== 全盘 debug.keystore =="
          find / -name 'debug.keystore' -not -path '/proc/*' -not -path '/sys/*' 2>/dev/null || true

  # ── 正式 Release（推 v* tag 时自动创建）────────────────────────────
  # 推 tag 触发 build job 编译 debug + release，完成后本 job 取 **release** 包，
  # 用它自己的真实文件名（zhengdao-<版本>-release.apk）发布，不再改名。
  # ⚠️ 早先这里是把 debug 包 cp 成 app-release.apk 冒充正式版——所有 Release 资产
  #    因此都是 37MB 调试件。见 docs/ERRATA.md E-013。
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 把关：没有签名密钥就不许发正式版
        # E-014 / E-099。这是**硬失败**（和 build job 里那两步刻意不同）：正式版一旦用随机 key
        # 签出去，用户升级时都会 INSTALL_FAILED_UPDATE_INCOMPATIBLE，只能卸载重装、Debian 环境全没。
        # 宁可这次 tag 发布失败，也不要发一份装不上的"正式版"。
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::未配置 secret RELEASE_KEYSTORE_B64——CI 会用随机 key 给正式版签名，用户装不上（docs/ERRATA.md E-014 / E-099）。先配好 secret 再推 tag。"
            exit 1
          fi

      - name: 检出代码（准备 Release 正文）
        uses: actions/checkout@v7

      - name: 下载构建产物
        uses: actions/download-artifact@v7
        with:
          name: zhengdao-build-${{ github.run_number }}
          path: dist

      - name: 定位 Release APK
        id: apk
        run: |
          # 用 nullglob + 数组，别写成 `APK=$(ls ... | head -n1)`：
          # 通配符没匹配到时 ls 非零退出，在 `set -e` 下会直接在赋值处中断，
          # 下面的"没找到"提示就永远打不出来（报错信息会变成一句难懂的 ls 失败）。
          shopt -s nullglob
          APKS=(dist/apk-release/zhengdao-*-release.apk)
          if [ ${#APKS[@]} -eq 0 ]; then
            echo "::error::没找到 release 包——build job 的 assembleRelease 可能没跑或被跳过"
            ls -laR dist/ || true
            exit 1
          fi
          APK="${APKS[0]}"
          echo "file=$APK" >> "$GITHUB_OUTPUT"
          echo "以 $(basename "$APK") 发布"

      - name: 选 Release 正文（按 tag 找专属正文）
        # E-068：以前 body_path 钉死在 `.github/release-notes.md` 这一份文件上，
        #      于是 v2.0.1~v2.0.5 的 Release 正文**全都一模一样**（都写着"证道 v2.0.0"、
        #      "下载 zhengdao-2.0.0-release.apk"）——发版的人以为改一份就够了。
        # 现在：优先用 `.github/release-notes/<tag>.md`，没有才退回通用正文。
        # 退回时只 `::warning::` **不失败**：正文写得不完美不该拦住发版。
        id: notes
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          if [ -f ".github/release-notes/$TAG.md" ]; then
            echo "file=.github/release-notes/$TAG.md" >> "$GITHUB_OUTPUT"
            echo "Release 正文：.github/release-notes/$TAG.md"
          else
            echo "file=.github/release-notes.md" >> "$GITHUB_OUTPUT"
            echo "::warning::没有 .github/release-notes/$TAG.md，退回通用正文 .github/release-notes.md（见 docs/ERRATA.md E-068）"
          fi

      - name: 创建正式 Release 并上传 APK
        uses: softprops/action-gh-release@v2
        with:
          name: "证道 ${{ github.ref_name }} — 正式版"
          body_path: ${{ steps.notes.outputs.file }}
          files: ${{ steps.apk.outputs.file }}
          draft: false
          prerelease: false

      - name: 补挂该版本的 RootFS 资产（整包 + 清单 + 索引）
        # 目的：以前**只有滚动版 `latest` 带 rootfs**，正式 tag 的 Release 只有 APK，
        #      于是"某个历史版本用什么环境"无法追溯、增量下发也无从累积基线
        #      （方案 §7-3 的欠账）。这里把滚动版当天的 rootfs 资产**搬一份**过来。
        # 做法：不重跑构建（tag 触发的 build job 按设计跳过 rootfs 构建那一大步，慢且没必要），
        #      直接 download 滚动版的资产再 upload 到本 tag 的 Release。
        # 只搬这几样：整包 + 边车、清单 + 边车、索引。
        #  **故意不搬 `rootfs-patch-*`**：补丁是"从上一版升到当前版"的一次性产物，
        #  名字里带 base→new 的 env，数量会不断累积；App 走索引里给的补丁 URL，
        #  而索引始终从滚动版读，所以 tag 上留补丁只增体积、没有用处。
        # 失败只告警不红：APK 已经发出去了，缺这几样不影响任何用户装 App
        #（App 读不到索引就照旧读滚动版的 manifest，再不济走全量下载）。
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p rootfs-assets
          cd rootfs-assets
          got=0
          for pat in 'debian-*.tar.zst' 'debian-*.tar.zst.sha256' \
                     'rootfs-manifest.txt' 'rootfs-manifest.txt.sha256' \
                     'rootfs-index.json'; do
            if gh release download latest --repo "$GITHUB_REPOSITORY" \
                 --pattern "$pat" --clobber 2>/dev/null; then
              echo "已取：$pat"
            else
              echo "滚动版里没有：$pat（跳过）"
            fi
          done
          shopt -s nullglob
          FILES=(*)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "::warning::滚动版里一个 rootfs 资产都没取到，本 tag 只发 APK"
            exit 0
          fi
          ls -l
          gh release upload "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" --clobber "${FILES[@]}"
          echo "已给 ${{ github.ref_name }} 补挂 ${#FILES[@]} 个 rootfs 资产"
