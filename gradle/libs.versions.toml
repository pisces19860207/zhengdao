[versions]
agp = "9.4.0"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
# 第㉚刀（2026-10-15）：2.6.1/2.8.7 → 2.11.0（maven-metadata 当前稳定版；两件对齐同版，
# 避免 runtime-ktx 与 runtime-compose 的 LocalLifecycleOwner 混版）。
lifecycleRuntimeKtx = "2.11.0"
# P4-7（issue #17）：compose.ui.platform.LocalLifecycleOwner 自 Compose UI 1.7 起废弃，
# 官方迁移目标 androidx.lifecycle.compose.LocalLifecycleOwner 由本 artifact 提供。
lifecycleRuntimeCompose = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.2.10"
composeBom = "2026.09.00"

# Macrobenchmark（真机性能基线）。1.5.0 = 2026-09 的稳定版，与 AGP 9.4 / Gradle 9.6 同代。
# ⚠️ 不要用 1.4.x 之前的版本：1.3 以下不支持 Gradle 9 的依赖元数据。
benchmarkMacro = "1.5.0"
# UiAutomator：基准里跨进程点按（底部 Tab、设置入口）靠它，Compose 语义节点同样可见。
uiautomator = "2.4.0"
# Detekt（P1-3，2026-10-19）：先只开 LongMethod / CyclomaticComplexity 两条、report-only。
# 1.23.8 = Maven Central 上的最新稳定版（无 2.x）。
detekt = "1.23.8"

# Markdown 渲染（v1.1 第四阶段）。锁 0.38.1 —— 该版本用 Kotlin 2.2.21 编译，
# 与本项目 2.2.10 同线（metadata 可读）；更新版本用 Kotlin 2.3/2.4，升库=升 Kotlin，
# 属架构级改动，不得混入 v1.1。依据：docs/milestones/证道-v1.1-第四阶段-Markdown调研报告.md §3。
markdownRenderer = "0.38.1"

# 134 批 lint(UseTomlInstead) 清零：原来硬写在 app/build.gradle.kts 里的 9 条依赖搬进
# 版本目录，**版本值与原来逐字相同**（不改任何依赖版本）。
# 第二百四十六批 OkHttp 5 升级：okhttp 与 mockwebserver 必须同版本（mockwebserver3:5.5.1
# 的 pom 直接依赖 okhttp-jvm:5.5.1，只升一半就是版本劈叉）。
okhttp = "5.5.1"
mockwebserver = "5.5.1"
# 第二百八十四批 导航库跨大版本升级：2.8.5 → 2.10.2。
# 2.10.2 = 2026-10-29 实测 Google Maven 元数据
# （curl dl.google.com/dl/android/maven2/androidx/navigation/navigation-compose/maven-metadata.xml，
#  <latest>/<release> 均为 2.10.2，<lastUpdated> 20260923170048），不是凭记忆写的版本号。
# ⚠️ 本单**只升这一个库**：同批不动任何其他依赖，否则回归出问题分不清是导航还是别人坏的。
navigationCompose = "2.10.2"
json = "20240303"
# 第一百六十七批 定时任务 v1：主调度用 WorkManager（非精确兜底），精确闹钟走 AlarmManager 自己发。
# 2.12.0 = 2026-10 Google Maven maven-metadata.xml 里的 latest/release（实测 curl dl.google.com，见交付报告 §0.6）。
# 版本目录写法（134 批 lint UseTomlInstead 口径：坐标不在 build.gradle.kts 里硬写）。2026-10-24
workManager = "2.12.0"

# 第二百五十二批 · 旧版 Excel（.xls / BIFF）只读：jxl（JExcelApi）。
# 2.6.12 = Maven Central 上**唯一也是最后一个**发布版（`maven-metadata.xml` 里
# `<latest>` / `<release>` 都是它，`lastUpdated=20110509`；实测 curl 见交付报告 §0.3）。
# 选它的三条理由：① 纯 Java（jar 里 534 个 class 逐个扫过，**没有一处**引用
# java.awt / javax / java.beans / org.apache / java.sql，Android 能直接跑）；
# ② 只读 BIFF 不引 POI 那一大坨（POI 的 ooxml+scratchpad 要 10MB+ 且带 commons-math 等传递依赖）；
# ③ 派工单点名。⚠️ 它的 POM 把 log4j 1.2.14 声明成 compile 作用域 —— 必须在依赖那一侧排除，
# 原因写在 app/build.gradle.kts 的 jxl 那一段。
jxl = "2.6.12"


[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
# 第二百四十一批：:terminal-core 只用 Compose 的 runtime（RootfsInstaller 的进度 State），
# 不引 UI —— 终端页仍在 :app，库模块不该背一套 compose-ui。
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmarkMacro" }
androidx-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
# Markdown 渲染（纯 Compose，非 WebView/TextView 包装）；m3 = Material3 主题，code = 代码块高亮 + 复制按钮
mikepenz-markdown = { group = "com.mikepenz", name = "multiplatform-markdown-renderer", version.ref = "markdownRenderer" }
mikepenz-markdown-m3 = { group = "com.mikepenz", name = "multiplatform-markdown-renderer-m3", version.ref = "markdownRenderer" }
mikepenz-markdown-code = { group = "com.mikepenz", name = "multiplatform-markdown-renderer-code", version.ref = "markdownRenderer" }
# Detekt CLI（P1-3）：不经 Gradle 插件，避免插件与 Gradle 9 / JDK 25 的兼容问题；
# 由 app/build.gradle.kts 的 detektReport / detektBaselineUpdate 两个 JavaExec 任务调用。
detekt-cli = { group = "io.gitlab.arturbosch.detekt", name = "detekt-cli", version.ref = "detekt" }

# 134 批 lint(UseTomlInstead)：下面 8 个坐标原来以字符串字面量写在 app/build.gradle.kts，
# 版本值原样搬入（okhttp 与 mockwebserver 同版本但分列两条，便于各自独立升级）。
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
# 第二百六十六批（2026-10-28）：`commons-compress` 与 `commons-lang3` 都已删（全仓源码零引用；
# 原为终端解压链服务，终端搬去 zhengdao-term 后主仓压缩只剩 JDK 自带 java.util.zip）。
# 同一批还删了 tukaani:xz（commons-compress 的 XZ 后端，随它一起失去引入方）。
# 取证与 APK 体积变化见报告「266-静态分析与依赖体检」。
# 246 批：5.x 起测试库换 artifact 名（mockwebserver → mockwebserver3），包名也从
# okhttp3.mockwebserver 变 mockwebserver3；alias 保持 mockwebserver，build.gradle.kts 不用动。
mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver3", version.ref = "mockwebserver" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
json = { group = "org.json", name = "json", version.ref = "json" }
# 定时任务（第一百六十七批）：只引 work-runtime（单进程），不引 work-runtime-ktx / work-testing——
# Worker 走同步 doWork()，测试用 JVM 纯判据，不需要 Robolectric。
androidx-work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "workManager" }
# 第二百五十二批 · 旧版 Excel（.xls / BIFF）只读转换（版本理由见 [versions] 的 jxl 注释）。
jxl = { group = "net.sourceforge.jexcelapi", name = "jxl", version.ref = "jxl" }


[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# 第二百四十批（抽 :core）：库模块插件。版本与 :app 同一个 agp 别名，不引入第二份版本号。
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-test = { id = "com.android.test", version.ref = "agp" }

