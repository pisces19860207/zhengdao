[versions]
agp = "9.4.0"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
# 第㉚刀（2026-10-15）：2.6.1/2.8.7 → 2.11.0（maven-metadata 当前稳定版；两件对齐同版，
# 避免 runtime-ktx 与 runtime-compose 的 LocalLifecycleOwner 混版）。
lifecycleRuntimeKtx = "2.11.0"
# P4-7（issue #17）：compose.ui.platform.LocalLifecycleOwner 自 Compose UI 1.7 起废弃，
# 官方迁移目标 androidx.lifecycle.compose.LocalLifecycleOwner 由本 artifact 提供。
lifecycleRuntimeCompose = "2.11.0"
activityCompose = "1.13.0"
kotlin = "2.2.10"
composeBom = "2026.09.00"

# Macrobenchmark（真机性能基线）。1.5.0 = 2026-09 的稳定版，与 AGP 9.4 / Gradle 9.6 同代。
# ⚠️ 不要用 1.4.x 之前的版本：1.3 以下不支持 Gradle 9 的依赖元数据。
benchmarkMacro = "1.5.0"
# UiAutomator：基准里跨进程点按（底部 Tab、设置入口）靠它，Compose 语义节点同样可见。
uiautomator = "2.4.0"

# Markdown 渲染（v1.1 第四阶段）。锁 0.38.1 —— 该版本用 Kotlin 2.2.21 编译，
# 与本项目 2.2.10 同线（metadata 可读）；更新版本用 Kotlin 2.3/2.4，升库=升 Kotlin，
# 属架构级改动，不得混入 v1.1。依据：docs/milestones/证道-v1.1-第四阶段-Markdown调研报告.md §3。
markdownRenderer = "0.38.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-benchmark-macro-junit4 = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmarkMacro" }
androidx-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
# Markdown 渲染（纯 Compose，非 WebView/TextView 包装）；m3 = Material3 主题，code = 代码块高亮 + 复制按钮
mikepenz-markdown = { group = "com.mikepenz", name = "multiplatform-markdown-renderer", version.ref = "markdownRenderer" }
mikepenz-markdown-m3 = { group = "com.mikepenz", name = "multiplatform-markdown-renderer-m3", version.ref = "markdownRenderer" }
mikepenz-markdown-code = { group = "com.mikepenz", name = "multiplatform-markdown-renderer-code", version.ref = "markdownRenderer" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-test = { id = "com.android.test", version.ref = "agp" }

