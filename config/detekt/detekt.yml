# Detekt 配置（P1-3，2026-10-19）
#
# 目的：先只开两条「可维护性」规则。266（2026-10-28）起进 CI 上闸（报告档＋预算闸）；
# 557（2026-11-10）起 LongMethod 降为提示，硬墙主判据＝CyclomaticComplexMethod（见文末）。
# 两条规则都只需要语法树，不需要类型解析（type resolution），所以对 AGP 9 内置 Kotlin
# 的工程也能跑。
#
# 为什么只开两条：G7 的痛点是「5 个文件吃掉 13% 生产代码」，先量 LongMethod /
# CyclomaticComplexMethod，不把 Style/Formatting 的几千条噪音一起放进来。
#
# ⚠️ CLI 默认不 buildUponDefaultConfig（没加 --build-upon-default-config）：本文件没写的规则一律不跑。
# 阈值按当前代码冻结时的默认值（LongMethod 60 行 / CyclomaticComplexMethod 15）留档；
# 首跑违规的 baseline.xml 已在 324（2026-10-31）整条删除（156/171 早已失效），判红由预算闸＋硬墙完成。

complexity:
  active: true
  LongMethod:
    active: true
    threshold: 60
  # Detekt 1.x 的规则名是 CyclomaticComplexMethod（质量报告里写的 CyclomaticComplexity
  # 是 2.x / 文档口语名，实际配置必须用 1.x 的名字）。
  CyclomaticComplexMethod:
    active: true
    threshold: 15

# ─────────────────────────────────────────────────────────────────────────────
# 硬墙上限移驾（557，2026-11-10）
#
# 本文件是**报告档**（detektReport / detektModulesReport 用）：LongMethod 与
# CyclomaticComplexMethod 都照测——557 起行数是「提示」不是闸（预算闸只把 LongMethod
# 印成 notice，不判红）。
# 硬墙（`:app:detektWall`）改用 config/detekt/detekt-wall.yml：只开 CyclomaticComplexMethod，
# 上限那行注释形态的 `# maxIssues: N` 也住在那边；与 issue-budget.json 的互锁随之指向那边。
# 为什么：547 实测行数闸逼着「为线数合并」（onEngineEvent 59/60，加一行就红）——
# 行数只作提示，主判据用圈复杂度（派工单 557 §⑩）。本文件不再放上限行，防两处真源漂移。
