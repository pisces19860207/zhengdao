# Detekt 配置（P1-3，2026-10-19）
#
# 目的：先只开两条「可维护性」规则，report-only、冻结基线；不设门槛、不影响 CI。
# 两条规则都只需要语法树，不需要类型解析（type resolution），所以对 AGP 9 内置 Kotlin
# 的工程也能跑。
#
# 为什么只开两条：G7 的痛点是「5 个文件吃掉 13% 生产代码」，先量 LongMethod /
# CyclomaticComplexMethod，不把 Style/Formatting 的几千条噪音一起放进来。
#
# ⚠️ CLI 默认不 buildUponDefaultConfig（没加 --build-upon-default-config）：本文件没写的规则一律不跑。
# 阈值按当前代码冻结时的默认值（LongMethod 60 行 / CyclomaticComplexMethod 15）留档；
# 首跑违规已进 `baseline.xml`，以后新增违规会出现在 report 里，但 `isIgnoreExitValue=true` 不拦构建。

complexity:
  active: true
  LongMethod:
    active: true
    threshold: 60
  # Detekt 1.x 的规则名是 CyclomaticComplexMethod（质量报告里写的 CyclomaticComplexity
  # 是 2.x / 文档口语名，实际配置必须用 1.x 的名字）。
  CyclomaticComplexMethod:
    active: true
    threshold: 15

# ─────────────────────────────────────────────────────────────────────────────
# 硬墙（276a D1，2026-10-29）
#
# ⚠️ detekt 1.23.8 **没有 YAML `maxIssues` 键**（官方文档：build failure 是「有 severity=error 的
#    问题就失败」，见 detekt 1.23.8 configurations）。硬墙用 CLI 的 `--max-issues` 实现：
#    构建脚本 `:app:detektWall` 读**下面这一行**，把它作为 `--max-issues` 传给 detekt；
#    一旦发现条数超过它，detekt 自己就非 0 退出（`isIgnoreExitValue=false`）——不依赖 python 脚本。
#
# 这一行同时是**互锁的一端**：`tools/check-detekt-budget.py` 会校验它必须等于
# `config/detekt/issue-budget.json` 的 `total`，不等即红（D2/D3）。
# 只准降不准升；要降时**两处同一提交一起改**（操作步骤见 config/detekt/README.md）。
#
# 为什么是 435（324，2026-10-31）：**口径修正，非放宽**——10-19 的旧 baseline 删除后，
# 被它压住的真读数 101 条（引擎 64／UI 冻结区 37）如实回到账面（带/无 baseline 双跑对照
# 334→435，证据等级「真跑」）。**只降不升从 435 起算：下一批至少降 5 条。**
# maxIssues: 435
#   ↑ 这行**故意是注释**：实测 detekt 1.23.8 把未注释的 `maxIssues:` 当非法键
#     （`Property 'maxIssues' is misspelled or does not exist.` ⇒ 退出码 3）。
#     值仍在这里（人读真源），由 `:app:detektWall` 与 check-detekt-budget.py 用正则读，
#     再作为 CLI `--max-issues` 交给 detekt 执行。
